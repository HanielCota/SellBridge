name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sellbridge
          POSTGRES_PASSWORD: sellbridge
          POSTGRES_DB: sellbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sellbridge" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sellbridge:sellbridge@localhost:5432/sellbridge
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:no-else
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sellbridge
          POSTGRES_PASSWORD: sellbridge
          POSTGRES_DB: sellbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sellbridge" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sellbridge:sellbridge@localhost:5432/sellbridge
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ADMIN_EMAILS: admin@sellbridge.local
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @sellbridge/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
