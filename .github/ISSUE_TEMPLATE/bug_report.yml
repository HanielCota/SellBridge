name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web dashboard
        - Worker / queues
        - Marketplace connectors
        - Database / migrations
        - Authentication
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant log lines (remove secrets and personal data).
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. 7c5515d
