# https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,css,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint {staged_files}
    - name: no-else
      glob: "*.{ts,tsx}"
      run: pnpm check:no-else
