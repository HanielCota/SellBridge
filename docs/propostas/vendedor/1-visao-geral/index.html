<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Propostas: visão geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: oklch(0.97 0.002 260); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.945 0.003 260); --muted-foreground: oklch(0.47 0.008 260); --brand: oklch(0.78 0.18 155);
    --brand-text: oklch(0.5 0.13 152); --brand-mark: oklch(0.62 0.16 152); --primary-foreground: oklch(0.2 0.015 250);
    --popover: oklch(1 0 0); --border: oklch(0 0 0 / 0.08); --mark: #ff2d2d;
  }
  :root.dark {
    --background: oklch(0.165 0.003 260); --foreground: oklch(0.97 0 0); --card: oklch(0.215 0.004 260);
    --muted: oklch(0.27 0.004 260); --muted-foreground: oklch(0.72 0.005 260); --brand: oklch(0.87 0.16 152);
    --brand-text: oklch(0.87 0.16 152); --brand-mark: oklch(0.87 0.16 152); --primary-foreground: oklch(0.18 0.02 160);
    --popover: oklch(0.24 0.004 260); --border: oklch(1 0 0 / 0.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .page { max-width: 1520px; margin: 0 auto; padding: 24px 24px 80px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .topbar p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 14px; }
  .toggle { border: 0; border-radius: 999px; background: var(--card); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; }
  .proposal { margin-top: 36px; }
  .proposal-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--foreground); color: var(--background); font-weight: 800; font-size: 18px; }
  .proposal-head h2 { font-size: 18px; margin: 0; }
  .note { color: var(--muted-foreground); font-size: 14px; margin: 4px 0 14px; max-width: 820px; line-height: 1.5; }
  .frames { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  .frames .mobile-col { max-width: 390px; }

  .frame { border-radius: 20px; outline: 1px solid var(--border); background: var(--background); overflow: hidden; }
  .frame-label { font-size: 12px; color: var(--muted-foreground); margin: 0 0 6px 4px; font-weight: 600; }
  .desktop-fit { overflow: hidden; }
  .desktop { width: 1440px; transform-origin: 0 0; }
  .mobile { width: 390px; position: relative; height: 560px; }

  /* Header reproduction (top-nav.tsx) */
  .hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 16px 32px; }
  .hdr .left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; }
  .nav { position: relative; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--card); padding: 6px; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 16px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--foreground); }
  .tab.active { background: var(--foreground); color: var(--background); }
  .tab .ic { font-size: 18px; }
  .right { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .round { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; min-width: 44px; border-radius: 999px; background: var(--card); color: var(--muted-foreground); font-size: 14px; font-weight: 500; border: 0; font-family: inherit; cursor: pointer; }
  .round:hover { color: var(--foreground); }
  .round .ic { font-size: 20px; }
  .round.labelled { padding: 0 16px 0 14px; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: var(--primary-foreground); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 10px; border-radius: 999px; background: var(--card); padding: 6px; }
  .avatar { width: 40px; height: 40px; border-radius: 999px; background: oklch(0.87 0.16 152); color: oklch(0.18 0.02 160); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .chip .name { line-height: 1.2; white-space: nowrap; }
  .chip .name b { display: block; font-size: 16px; font-weight: 500; }
  .chip .name span { font-size: 14px; color: var(--muted-foreground); }
  .caret { width: 40px; height: 40px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 18px; }
  .content { padding: 20px 32px 28px; }
  .content h3 { font-size: 56px; letter-spacing: -0.03em; margin: 0; font-weight: 600; }
  .content p { color: var(--muted-foreground); margin: 6px 0 0; font-size: 14px; }

  /* Mobile */
  .m-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .m-hdr .group { display: flex; align-items: center; gap: 8px; }
  .sheet { position: absolute; inset: 76px auto 0 0; border-top-right-radius: 20px; width: 300px; background: var(--card); padding: 18px 14px; box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5); }
  .sheet .close { display: flex; justify-content: flex-end; color: var(--muted-foreground); font-size: 22px; margin-bottom: 18px; }
  .m-item { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 999px; color: var(--muted-foreground); font-size: 18px; font-weight: 500; }
  .m-item.active { background: var(--foreground); color: var(--background); }
  .m-item .ic { font-size: 22px; }
  .m-item .count { margin-left: 2px; min-width: 22px; height: 22px; border-radius: 999px; background: oklch(0.87 0.16 152 / 0.18); color: var(--brand-text); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

  /* B: soft background behind the icon */
  .b .tab .ic, .b .m-item .ic { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--muted); font-size: 16px; }
  .b .tab { padding-left: 6px; }
  .b .tab.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .m-item { padding-left: 8px; }
  .b .m-item .ic { width: 34px; height: 34px; font-size: 19px; }
  .b .m-item.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .round.labelled .ic { font-size: 18px; }

  /* C: icon above the label */
  .c .tab { flex-direction: column; justify-content: center; gap: 2px; height: 56px; padding: 0 14px; font-size: 13px; border-radius: 18px; }
  .c .nav { border-radius: 24px; }
  .c .tab .ic { font-size: 20px; }
  .c .round.stacked { flex-direction: column; gap: 2px; height: 68px; min-width: 64px; border-radius: 20px; font-size: 12px; padding: 0 8px; }
  .c .chip { border-radius: 24px; }
  .c .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .c .m-item { flex-direction: column; justify-content: center; gap: 6px; height: 84px; border-radius: 18px; background: var(--muted); font-size: 15px; padding: 0 8px; }
  .c .m-item.active { background: var(--foreground); }
  .c .m-item .ic { font-size: 24px; }

  /* Tooltip (components/ui/tooltip.tsx look) */
  .tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: var(--foreground); color: var(--background); font-size: 12px; line-height: 1.35; padding: 6px 12px; border-radius: 8px; opacity: 0; transform: translateY(2px) scale(0.97); transition: opacity 120ms, transform 120ms; }
  .tip.on { opacity: 1; transform: none; }
  .tip::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -4px; width: 10px; height: 10px; margin-left: -5px; background: var(--foreground); transform: rotate(45deg); border-radius: 2px; }
  .tip.below::after { bottom: auto; top: -4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted-foreground); font-size: 13px; margin-top: 10px; }
  .legend b { color: var(--foreground); font-weight: 600; }

  /* Section 1: overview reproduction (dashboard.tsx, kpi-tiles, cash-flow-chart, sales-breakdown, attention-panel) */
  .dash { padding: 8px 32px 32px; }
  .dash h3 { font-size: 72px; letter-spacing: -0.035em; margin: 0; font-weight: 600; line-height: 1; }
  .dash .cap { color: var(--muted-foreground); font-size: 14px; margin: 10px 0 0; }
  .dash .lead { font-size: 18px; line-height: 1.6; color: var(--muted-foreground); max-width: 640px; margin: 26px 0 0; }
  .dash .lead b { color: var(--foreground); font-weight: 600; }
  .dash .lead .up { color: oklch(0.8 0.17 152); font-weight: 600; }
  .row1 { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; margin-top: 30px; }
  .tiles { display: grid; gap: 16px; }
  .tile { position: relative; border-radius: 24px; background: var(--card); padding: 20px; min-height: 134px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
  .tile-top { display: flex; justify-content: space-between; align-items: flex-start; font-size: 14px; color: var(--muted-foreground); }
  .tile-title { display: inline-flex; align-items: center; gap: 8px; }
  .tile-title .ic { font-size: 16px; }
  .arrow { font-size: 16px; color: var(--muted-foreground); }
  .tile:hover .arrow { color: var(--foreground); }
  .fig { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
  .fig small { font-size: 11px; color: var(--muted-foreground); vertical-align: top; margin-right: 3px; }
  .chg { font-size: 12px; color: var(--muted-foreground); margin-top: 6px; max-width: 150px; }
  .sumrow .chg { max-width: none; }
  .chg .g { color: oklch(0.8 0.17 152); font-weight: 600; } .chg .r { color: oklch(0.7 0.19 25); font-weight: 600; }
  .spark { position: absolute; right: 20px; bottom: 26px; width: 84px; height: 26px; color: oklch(0.8 0.17 152); }
  .term { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  .chart { border-radius: 24px; background: var(--card); padding: 18px; }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .seg { display: flex; gap: 2px; background: var(--muted); border-radius: 999px; padding: 4px; }
  .seg span { height: 32px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 999px; font-size: 14px; color: var(--muted-foreground); }
  .seg span.on { background: var(--foreground); color: var(--background); font-weight: 500; }
  .select { height: 40px; min-width: 170px; border-radius: 999px; border: 1px solid var(--border); background: var(--muted); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 14px; }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 16px; background: transparent; cursor: pointer; }
  .iconbtn:hover, .textbtn:hover, .seeall:hover { color: var(--foreground); }
  .textbtn { height: 40px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 16px 0 13px; color: var(--muted-foreground); font-size: 14px; font-weight: 500; background: transparent; cursor: pointer; white-space: nowrap; }
  .textbtn .ic { font-size: 16px; }
  .sumrow { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; }
  .sumrow .lbl { font-size: 14px; color: var(--muted-foreground); }
  .pills { display: flex; gap: 8px; }
  .pill { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted-foreground); }
  .pill.on { background: var(--foreground); color: var(--background); border-color: transparent; }
  .dot { width: 7px; height: 7px; border-radius: 9px; background: var(--muted-foreground); } .dot.g { background: oklch(0.8 0.17 152); }
  .plot { display: block; width: 100%; height: 230px; margin-top: 14px; color: oklch(0.8 0.17 152); }
  .row2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  .card { position: relative; border-radius: 24px; background: var(--card); padding: 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; height: 32px; }
  .card-head h4 { margin: 0; font-size: 17px; font-weight: 500; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 8px; }
  .card-head h4 .ic { font-size: 18px; }
  .cardlink { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 14px; }
  .card:hover .cardlink { background: var(--foreground); color: var(--background); }
  .seeall { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
  .seeall .ic { font-size: 14px; }
  .store { margin-top: 18px; font-size: 14px; }
  .store .l { display: flex; justify-content: space-between; font-weight: 500; }
  .bar { height: 6px; border-radius: 9px; background: var(--muted); margin: 10px 0 6px; } .bar i { display: block; height: 100%; border-radius: 9px; background: oklch(0.8 0.17 152); }
  .store .m { color: var(--muted-foreground); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 14px; }
  th { text-align: left; font-weight: 400; color: var(--muted-foreground); font-size: 13px; padding: 6px 0; }
  th.n, td.n { text-align: right; } td { padding: 10px 0; border-top: 1px solid var(--border); }
  .att { display: flex; gap: 12px; align-items: flex-start; margin-top: 18px; font-size: 14px; }
  .att .bub { width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none; }
  .att p { margin: 2px 0 0; color: var(--muted-foreground); font-size: 13px; }
  .fab { position: absolute; right: 26px; bottom: 26px; width: 56px; height: 56px; border-radius: 999px; background: oklch(0.8 0.17 152); color: oklch(0.18 0.02 160); display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 8px 24px oklch(0 0 0 / 0.35); }
  .desk-wrap { position: relative; }
  /* mobile */
  .mob { padding: 14px; }
  .mob .tile { min-height: 116px; }
  .mob .chart { margin-top: 12px; padding: 14px; }
  .mob .seg span { padding: 0 10px; font-size: 13px; }
  .mob .select { width: 100%; margin-top: 10px; }
  .mob .sumrow { margin-top: 14px; align-items: flex-start; }
  .mob .tools { margin-left: 0; }
  .mob .textbtn { padding: 0 12px 0 10px; font-size: 13px; height: 36px; }
  .mob .iconbtn { width: 36px; height: 36px; }
  .mob .card { margin-top: 12px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1>Seção 1 · Visão geral (vendedor)</h1>
      <p>Todas partem do padrão A da barra superior. Passe o mouse (ou toque) nos itens: setas dos cartões, "Ticket médio", gráfico, exportar, "Unid." e o botão de chat.</p>
    </div>
    <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
  </div>
  <div id="root"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

const HINT = {
  revenue: "Ver a receita em detalhes no Financeiro",
  orders: "Ver os pedidos do período no Financeiro",
  ticket: "Ver o ticket médio no Financeiro",
  ticketTerm: "Valor médio de cada pedido no período",
  chartKind: "Escolha outro jeito de ver o gráfico",
  export: "Exportar os pedidos do período em uma planilha",
  stores: "Ver todas as suas lojas",
  products: "Ver todas as suas publicações",
  units: "Unidades vendidas no período",
  chat: "Converse com a equipe do SellBridge",
  custom: "Escolher as datas do período",
};
const PROPOSALS = [
  { key: "now", letter: "–", title: "Como está hoje", note: "Setas e botões só com ícone, sem legenda (o gráfico e o exportar usam o \"title\" do navegador, que demora e some). \"Ticket médio\" e \"Unid.\" sem explicação." },
  { key: "a", letter: "A", title: "Só legendas", note: "Nada muda de lugar: os mesmos ícones ganham legenda no tema. \"Ticket médio\" ganha sublinhado pontilhado e legenda. O botão do gráfico troca a engrenagem por um ícone de gráfico, e o de exportar ganha o ícone de \"Exportar\" (diferente de \"Baixar\")." },
  { key: "b", letter: "B", title: "Ações com texto (recomendada)", note: "Como A, e as ações que hoje são só ícone ganham o nome ao lado: \"Gráfico\", \"Exportar\" e \"Ver tudo\" nos cartões. \"Unid.\" vira \"Unidades\". Mais claro para quem não reconhece ícones; ocupa um pouco mais de espaço." },
  { key: "c", letter: "C", title: "Ícones nos títulos", note: "Como A, e cada cartão ganha um ícone pequeno ao lado do título (receita, pedidos, ticket médio, lojas, mais vendidos, precisa de você). Ajuda a achar o cartão de relance, mas acrescenta 6 ícones à tela." },
];
const ic = (name) => `<span class="ic">${ICONS[name].regular}</span>`;
const bold = (name) => `<span class="ic">${ICONS[name].bold}</span>`;
const tipAttr = (key, text) => (key === "now" ? "" : ` data-tip="${text}" tabindex="0"`);
const spark = `<svg class="spark" viewBox="0 0 84 26" fill="none"><path d="M2 18 L8 14 L12 20 L18 9 L22 16 L28 12 L33 19 L38 7 L44 15 L50 11 L56 18 L62 6 L68 16 L74 12 L80 20" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="81" cy="21" r="2" fill="currentColor"/></svg>`;

function tile(key, title, icon, figure, change, hint, opts = {}) {
  const titleText = opts.term && key !== "now" ? `<span class="term" data-tip="${HINT.ticketTerm}" tabindex="0">${title}</span>` : title;
  const glyph = key === "c" ? ic(icon) : "";
  return `<div class="tile"${tipAttr(key, hint)}><div class="tile-top"><span class="tile-title">${glyph}${titleText}</span><span class="arrow">${ICONS.ArrowUpRight.regular}</span></div><div><div class="fig">${figure}</div><div class="chg">${change}</div></div>${spark}</div>`;
}
function tiles(key) {
  return tile(key, "Receita", "Coins", "<small>R$</small>9.143", '<span class="g">↑ 3%</span> vs. anterior', HINT.revenue)
    + tile(key, "Pedidos", "ShoppingBag", "97", '<span class="g">↑ 16%</span> vs. anterior · 1 cancelado', HINT.orders)
    + tile(key, "Ticket médio", "Receipt", "<small>R$</small>94", '<span class="r">↓ 11%</span> vs. anterior', HINT.ticket, { term: true });
}
function tools(key) {
  if (key === "now") return `<button class="iconbtn" aria-label="Tipo de gráfico">${ICONS.GearSix.regular}</button><button class="iconbtn" aria-label="Exportar">${ICONS.DownloadSimple.regular}</button>`;
  if (key === "b") return `<button class="textbtn"${tipAttr(key, HINT.chartKind)}>${ic("ChartBar")}Gráfico</button><button class="textbtn"${tipAttr(key, HINT.export)}>${ic("FileArrowDown")}Exportar</button>`;
  return `<button class="iconbtn"${tipAttr(key, HINT.chartKind)} aria-label="Tipo de gráfico">${ICONS.ChartBar.regular}</button><button class="iconbtn"${tipAttr(key, HINT.export)} aria-label="Exportar">${ICONS.FileArrowDown.regular}</button>`;
}
const plot = `<svg class="plot" viewBox="0 0 900 230" preserveAspectRatio="none" fill="none"><path d="M0 120 C40 110 60 210 90 170 S150 120 180 160 S260 100 300 150 S360 40 400 150 S470 120 500 140 S560 60 600 140 S660 120 700 130 S760 50 800 150 S860 170 900 225" stroke="oklch(0.6 0 0)" stroke-width="2"/><path d="M0 190 C40 185 60 225 90 205 S150 180 180 200 S260 175 300 195 S360 130 400 200 S470 180 500 190 S560 160 600 195 S660 185 700 190 S760 150 800 200 S860 205 900 228" stroke="currentColor" stroke-width="3"/></svg>`;
function chart(key, mobile) {
  const seg = mobile
    ? `<div class="seg"><span>Hoje</span><span>7d</span><span class="on">30d</span><span>90d</span><span>6m</span><span${tipAttr(key, HINT.custom)} aria-label="Personalizado">${ICONS.CalendarBlank.regular}</span></div>`
    : `<div class="seg"><span>Hoje</span><span>7 dias</span><span class="on">30 dias</span><span>90 dias</span><span>6 meses</span><span>${ICONS.CalendarBlank.regular} Personalizado</span></div>`;
  const select = `<div class="select">Todas as lojas ${ICONS.CaretDown.regular}</div>`;
  const pills = `<div class="pills"><span class="pill on">Tudo</span><span class="pill"><i class="dot"></i>Receita</span><span class="pill"><i class="dot g"></i>Lucro</span></div>`;
  const figure = `<div><div class="lbl">Lucro no período</div><div class="fig"><small>R$</small>3.462</div><div class="chg"><span class="g">↑ 11%</span> vs. período anterior</div></div>`;
  if (mobile) {
    return `<div class="chart">${seg}${select}<div class="sumrow">${figure}<div class="tools">${tools(key)}</div></div><div style="margin-top:12px">${pills}</div>${plot.replace('class="plot"', 'class="plot" style="height:150px"')}</div>`;
  }
  return `<div class="chart"><div class="toolbar">${seg}${select}<div class="tools">${tools(key)}</div></div><div class="sumrow">${figure}${pills}</div>${plot}</div>`;
}
function cardHead(key, title, icon, hint) {
  const glyph = key === "c" ? ic(icon) : "";
  const link = key === "b"
    ? `<span class="seeall"${tipAttr(key, hint)}>Ver tudo${bold("ArrowUpRight")}</span>`
    : `<span class="cardlink"${tipAttr(key, hint)}>${ICONS.ArrowUpRight.bold}</span>`;
  return `<div class="card-head"><h4>${glyph}${title}</h4>${link}</div>`;
}
function stores(key) {
  return `<div class="card">${cardHead(key, "Vendas por loja", "Storefront", HINT.stores)}
    <div class="store"><div class="l"><span>Ana Moda</span><span>R$ 5.397,60</span></div><div class="bar"><i style="width:59%"></i></div><div class="m">48 vendas · lucro R$ 1.928,79 · 36% de margem</div></div>
    <div class="store"><div class="l"><span>Ana Casa &amp; Beleza</span><span>R$ 3.745,30</span></div><div class="bar"><i style="width:41%"></i></div><div class="m">49 vendas · lucro R$ 1.533,13 · 41% de margem</div></div></div>`;
}
function products(key, mobile) {
  const unitHead = key === "b" ? "Unidades" : key === "now" ? "Unid." : `<span class="term" data-tip="${HINT.units}" tabindex="0">Unid.</span>`;
  const unitCol = mobile ? "" : `<th class="n">${unitHead}</th>`;
  const rows = [["Jaqueta jeans oversized - Verde", 8, "R$ 1.215,20"], ["Body manga longa canelado - Bege", 18, "R$ 1.186,20"], ["Blusa de tricô canelada - Verde", 11, "R$ 867,90"]]
    .map(([name, units, total], index) => `<tr><td style="width:22px;color:var(--muted-foreground)">${index + 1}</td><td>${name}</td>${mobile ? "" : `<td class="n">${units}</td>`}<td class="n">${total}</td></tr>`).join("");
  return `<div class="card">${cardHead(key, "Produtos mais vendidos", "Trophy", HINT.products)}<table><tr><th></th><th>Produto</th>${unitCol}<th class="n">Receita</th></tr>${rows}</table></div>`;
}
function attention(key) {
  const title = key === "c" ? `${ic("BellRinging")}Precisa de você` : "Precisa de você";
  return `<div class="card"><div class="card-head"><h4>${title}</h4></div>
    <div class="att"><span class="bub" style="background:oklch(0.6 0.12 230 / 0.18);color:oklch(0.75 0.12 230)">${ICONS.Headset.regular}</span><div>2 chamados com resposta nova<p>A equipe respondeu seus chamados.</p></div></div>
    <div class="att"><span class="bub" style="background:oklch(0.8 0.15 85 / 0.18);color:oklch(0.82 0.15 85)">${ICONS.ChatCenteredText.regular}</span><div>43 pedidos para avaliar<p>Conte como o fornecedor se saiu e ajude a formar o score.</p></div></div></div>`;
}
function desktop(key) {
  return `<div class="desk-wrap"><div class="dash"><h3>Painel de vendas</h3><p class="cap">19 de set. – 18 de out. de 2026 · comparado com os 30 dias anteriores</p>
    <p class="lead">Você lucrou <b>R$ 3.462</b> no período, <span class="up">11% a mais</span> que no anterior, com <b>38% de margem</b>.</p>
    <div class="row1"><div class="tiles">${tiles(key)}</div>${chart(key, false)}</div>
    <div class="row2">${stores(key)}${products(key, false)}${attention(key)}</div></div>
    <div class="fab"${tipAttr(key, HINT.chat)} aria-label="Chat de suporte">${ICONS.ChatCircleDots.fill}</div></div>`;
}
function mobile(key) {
  return `<div class="mob" style="position:relative">${tile(key, "Ticket médio", "Receipt", "<small>R$</small>94", '<span class="r">↓ 11%</span> vs. anterior', HINT.ticket, { term: true })}${chart(key, true)}${products(key, true)}</div>`;
}
function render() {
  document.getElementById("root").innerHTML = PROPOSALS.map((p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px (trechos que mudam)</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`).join("");
  fit();
}
function fit() {
  document.querySelectorAll(".desktop-fit").forEach((box) => {
    const inner = box.firstElementChild;
    const scale = Math.min(1, box.clientWidth / 1440);
    inner.style.transform = `scale(${scale})`;
    box.style.height = `${inner.offsetHeight * scale}px`;
  });
}
// Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
const tip = document.getElementById("tip");
let timer = 0, current = null;
function show(el) {
  current = el;
  tip.textContent = el.dataset.tip;
  tip.classList.remove("below");
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
  let left = Math.max(frame.left + 8, Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2));
  let top = r.top - h - 10;
  if (top < 8) { top = r.bottom + 10; tip.classList.add("below"); }
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
  tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
  tip.classList.add("on");
}
function hide() { clearTimeout(timer); current = null; tip.classList.remove("on"); }
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el === current) return;
  hide();
  if (el) timer = setTimeout(() => show(el), 300);
});
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el && el !== current) { hide(); show(el); return; }
  hide();
});
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
document.addEventListener("focusout", hide);
window.addEventListener("scroll", hide, { passive: true });
window.addEventListener("resize", fit);
const themeButton = document.getElementById("theme");
themeButton.addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
});
render();
document.fonts.ready.then(fit);
</script>
</body>
</html>
