<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Propostas: barra superior</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.97 0.002 260);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted: oklch(0.945 0.003 260);
        --muted-foreground: oklch(0.47 0.008 260);
        --brand: oklch(0.78 0.18 155);
        --brand-text: oklch(0.5 0.13 152);
        --brand-mark: oklch(0.62 0.16 152);
        --primary-foreground: oklch(0.2 0.015 250);
        --popover: oklch(1 0 0);
        --border: oklch(0 0 0 / 0.08);
        --mark: #ff2d2d;
      }
      :root.dark {
        --background: oklch(0.165 0.003 260);
        --foreground: oklch(0.97 0 0);
        --card: oklch(0.215 0.004 260);
        --muted: oklch(0.27 0.004 260);
        --muted-foreground: oklch(0.72 0.005 260);
        --brand: oklch(0.87 0.16 152);
        --brand-text: oklch(0.87 0.16 152);
        --brand-mark: oklch(0.87 0.16 152);
        --primary-foreground: oklch(0.18 0.02 160);
        --popover: oklch(0.24 0.004 260);
        --border: oklch(1 0 0 / 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .page {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .topbar h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .topbar p {
        margin: 4px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .toggle {
        border: 0;
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
      .proposal {
        margin-top: 36px;
      }
      .proposal-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
      }
      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
        font-size: 18px;
      }
      .proposal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 4px 0 14px;
        max-width: 820px;
        line-height: 1.5;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .frames .mobile-col {
        max-width: 390px;
      }

      .frame {
        border-radius: 20px;
        outline: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }
      .frame-label {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px 4px;
        font-weight: 600;
      }
      .desktop-fit {
        overflow: hidden;
      }
      .desktop {
        width: 1440px;
        transform-origin: 0 0;
      }
      .mobile {
        width: 390px;
        position: relative;
        height: 560px;
      }

      /* Header reproduction (top-nav.tsx) */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
      }
      .hdr .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted-foreground);
        white-space: nowrap;
        cursor: pointer;
        text-decoration: none;
      }
      .tab:hover {
        color: var(--foreground);
      }
      .tab.active {
        background: var(--foreground);
        color: var(--background);
      }
      .tab .ic {
        font-size: 18px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }
      .round {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .round:hover {
        color: var(--foreground);
      }
      .round .ic {
        font-size: 20px;
      }
      .round.labelled {
        padding: 0 16px 0 14px;
      }
      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152);
        color: oklch(0.18 0.02 160);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip .name {
        line-height: 1.2;
        white-space: nowrap;
      }
      .chip .name b {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .chip .name span {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .caret {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .content {
        padding: 20px 32px 28px;
      }
      .content h3 {
        font-size: 56px;
        letter-spacing: -0.03em;
        margin: 0;
        font-weight: 600;
      }
      .content p {
        color: var(--muted-foreground);
        margin: 6px 0 0;
        font-size: 14px;
      }

      /* Mobile */
      .m-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      .m-hdr .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sheet {
        position: absolute;
        inset: 76px auto 0 0;
        border-top-right-radius: 20px;
        width: 300px;
        background: var(--card);
        padding: 18px 14px;
        box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5);
      }
      .sheet .close {
        display: flex;
        justify-content: flex-end;
        color: var(--muted-foreground);
        font-size: 22px;
        margin-bottom: 18px;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 18px;
        font-weight: 500;
      }
      .m-item.active {
        background: var(--foreground);
        color: var(--background);
      }
      .m-item .ic {
        font-size: 22px;
      }
      .m-item .count {
        margin-left: 2px;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152 / 0.18);
        color: var(--brand-text);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* B: soft background behind the icon */
      .b .tab .ic,
      .b .m-item .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        font-size: 16px;
      }
      .b .tab {
        padding-left: 6px;
      }
      .b .tab.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .m-item {
        padding-left: 8px;
      }
      .b .m-item .ic {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .b .m-item.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .round.labelled .ic {
        font-size: 18px;
      }

      /* C: icon above the label */
      .c .tab {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 56px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 18px;
      }
      .c .nav {
        border-radius: 24px;
      }
      .c .tab .ic {
        font-size: 20px;
      }
      .c .round.stacked {
        flex-direction: column;
        gap: 2px;
        height: 68px;
        min-width: 64px;
        border-radius: 20px;
        font-size: 12px;
        padding: 0 8px;
      }
      .c .chip {
        border-radius: 24px;
      }
      .c .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .c .m-item {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        height: 84px;
        border-radius: 18px;
        background: var(--muted);
        font-size: 15px;
        padding: 0 8px;
      }
      .c .m-item.active {
        background: var(--foreground);
      }
      .c .m-item .ic {
        font-size: 24px;
      }

      /* Tooltip (components/ui/tooltip.tsx look) */
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--foreground);
        color: var(--background);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(2px) scale(0.97);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        left: var(--arrow, 50%);
        bottom: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--foreground);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .tip.below::after {
        bottom: auto;
        top: -4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 10px;
      }
      .legend b {
        color: var(--foreground);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div>
          <h1>Seção 0 · Barra superior (vendedor)</h1>
          <p>
            Passe o mouse (ou toque) nos itens para ver as legendas. Mesmos dados e tamanhos do
            site: 1440 px no computador e 390 px no celular.
          </p>
        </div>
        <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
      </div>
      <div id="root"></div>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>

        },
        X: {
          regular:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg>',

          duotone:

        },
      };
      const LOGO =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs>  <linearGradient id="ramp" x1="20" y1="94" x2="100" y2="4" gradientUnits="userSpaceOnUse">    <stop stop-color="#00a98a"/><stop offset="1" stop-color="#00e696"/>  </linearGradient>  <linearGradient id="arch" x1="80" y1="48" x2="80" y2="124" gradientUnits="userSpaceOnUse">    <stop stop-color="#00b38d"/><stop offset=".55" stop-color="#16dc99"/><stop offset="1" stop-color="#66ebab"/>  </linearGradient></defs><g transform="translate(0 16)"><path d="M79 4H121L24 94C11 83 8 66 21 54L70 10C73 6 76 4 79 4Z" fill="url(#ramp)"/><path d="M4 124L80 59C95 46 115 44 132 53C149 62 156 77 156 96V124H121V96C121 84 116 78 107 78C101 78 97 80 92 85L47 124Z" fill="url(#arch)"/></g></svg>';
      const TABS = [
        [
          "Visão geral",
          "SquaresFour",
          "Resumo das suas vendas, do lucro e do que precisa de atenção",
        ],
        ["Catálogo", "Package", "Escolha produtos dos fornecedores para vender nas suas lojas"],
        ["Publicações", "MegaphoneSimple", "Acompanhe os produtos publicados nas suas lojas"],
        ["Pedidos", "ShoppingBag", "Veja os pedidos dos compradores e acompanhe os envios"],
        ["Lojas", "Storefront", "Conecte e acompanhe suas lojas do Mercado Livre"],
        ["Financeiro", "Wallet", "Veja receita, custos, lucro e repasses"],
      ];
      const HINTS = {
        search: "Buscar pedidos, produtos e lojas",
        support: "Fale com a equipe do SellBridge ou acompanhe seus chamados",
        bell: "Veja os avisos sobre seus pedidos, lojas e publicações",
        menu: "Abrir as seções do SellBridge",
      };
      const PROPOSALS = [
        {
          key: "now",
          letter: "–",
          title: "Como está hoje",
          note: "Abas só com texto; Buscar e Avisos só com ícone, sem legenda; Suporte com headset e texto (PR #59).",
        },
        {
          key: "a",
          letter: "A",
          title: "Minimalista: ícone pequeno ao lado do texto",
          note: "Ícone de 18 px na cor do texto, à esquerda de cada aba. Buscar e Avisos continuam só com ícone (padrões universais), agora com legenda. Todas as abas ganham legenda curta. Altura da barra não muda.",
        },
        {
          key: "b",
          letter: "B",
          title: "Ícone com fundo suave",
          note: "O ícone fica num círculo cinza discreto ao lado do texto, o que deixa as abas um pouco mais largas. Buscar e Avisos ganham o texto ao lado do ícone. Mesmas legendas. Atenção: em 1440 px a barra não cabe inteira (o botão da conta fica cortado); para usar B, o nome da conta teria de sumir em telas abaixo de 1536 px.",
        },
        {
          key: "c",
          letter: "C",
          title: "Ícone acima do texto",
          note: "Abas e botões viram blocos com o ícone em cima e o nome embaixo, como numa barra de aplicativo. A barra fica mais alta (68 px em vez de 52 px). No celular o menu vira uma grade de blocos. Mesmas legendas.",
        },
      ];
      const icon = (name) => `<span class="ic">${ICONS[name].regular}</span>`;
      const withTip = (text) => (text ? ` data-tip="${text}" tabindex="0"` : "");

      function tabs(key) {
        return TABS.map(([label, ic, tip], index) => {
          const active = index === 0 ? " active" : "";
          const tipAttr = key === "now" ? "" : withTip(tip);
          const glyph = key === "now" ? "" : icon(ic);
          return `<a class="tab${active}"${tipAttr}>${glyph}<span>${label}</span></a>`;
        }).join("");
      }
      function actions(key) {
        const sup = `<button class="round labelled${key === "c" ? " stacked" : ""}"${withTip(key === "now" ? "" : HINTS.support)}>${icon("Headset")}<span>Suporte</span><span class="badge">2</span></button>`;
        if (key === "now" || key === "a") {
          return `<button class="round"${withTip(key === "now" ? "" : HINTS.search)} aria-label="Buscar">${icon("MagnifyingGlass")}</button>${sup}<button class="round"${withTip(key === "now" ? "" : HINTS.bell)} aria-label="Avisos">${icon("Bell")}<span class="badge">9</span></button>`;
        }
        const extra = key === "c" ? " stacked" : "";
        return `<button class="round labelled${extra}"${withTip(HINTS.search)}>${icon("MagnifyingGlass")}<span>Buscar</span></button>${sup}<button class="round labelled${extra}"${withTip(HINTS.bell)}>${icon("Bell")}<span>Avisos</span><span class="badge">9</span></button>`;
      }
      const chip = `<div class="chip"><div class="avatar">AR</div><div class="name"><b>Ana Revendedora</b><span>Revendedor</span></div><div class="caret">${ICONS.CaretDown.regular}</div></div>`;

      function desktop(key) {
        return `<div class="hdr"><div class="left"><div class="logo">${LOGO}</div></div><nav class="nav">${tabs(key)}</nav><div class="right">${actions(key)}${chip}</div></div>
  <div class="content"><h3>Painel de vendas</h3><p>19 de set. – 18 de out. de 2026 · comparado com os 30 dias anteriores</p></div>`;
      }
      function mobile(key) {
        const menuLabel = key === "now" ? "" : "<span>Menu</span>";
        const menuClass = key === "now" ? "round" : "round labelled";
        const menuBtn = `<button class="${menuClass}"${withTip(key === "now" ? "" : HINTS.menu)} aria-label="Abrir menu">${icon("List")}${menuLabel}</button>`;
        const items = [...TABS, ["Suporte", "Headset", HINTS.support]]
          .map(([label, ic, tip], index) => {
            const glyph = key === "now" ? "" : icon(ic);
            const count = label === "Suporte" ? '<span class="count">2</span>' : "";
            return `<div class="m-item${index === 0 ? " active" : ""}"${key === "now" ? "" : withTip(tip)}>${glyph}<span>${label}</span>${count}</div>`;
          })
          .join("");
        const list = key === "c" ? `<div class="m-grid">${items}</div>` : items;
        return `<div class="m-hdr"><div class="group">${menuBtn}<div class="logo">${LOGO}</div></div><div class="group"><button class="round" aria-label="Buscar">${icon("MagnifyingGlass")}</button><button class="round" aria-label="Avisos">${icon("Bell")}<span class="badge">9</span></button><div class="avatar">AR</div></div></div>
  <div class="content" style="padding:12px 16px"><h3 style="font-size:40px">Painel de vendas</h3></div>
  <div class="sheet"><div class="close">${ICONS.X.regular}</div>${list}</div>`;
      }
      function render() {
        document.getElementById("root").innerHTML = PROPOSALS.map(
          (p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px, menu aberto (a barra fica visível aqui só para comparação)</p><div class="frame mobile">${mobile(p.key)}</div></div>
      </div>
    </section>`,
        ).join("");
        fit();
      }
      function fit() {
        document.querySelectorAll(".desktop-fit").forEach((box) => {
          const inner = box.firstElementChild;
          const scale = Math.min(1, box.clientWidth / 1440);
          inner.style.transform = `scale(${scale})`;
          box.style.height = `${inner.offsetHeight * scale}px`;
        });
      }
      // Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
      const tip = document.getElementById("tip");
      let timer = 0,
        current = null;
      function show(el) {
        current = el;
        tip.textContent = el.dataset.tip;
        tip.classList.remove("below");
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth,
          h = tip.offsetHeight;
        let left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
        let top = r.top - h - 10;
        if (top < 8) {
          top = r.bottom + 10;
          tip.classList.add("below");
        }
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
        tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
        tip.classList.add("on");
      }
      function hide() {
        clearTimeout(timer);
        current = null;
        tip.classList.remove("on");
      }
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el === current) return;
        hide();
        if (el) timer = setTimeout(() => show(el), 300);
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && el !== current) {
          hide();
          show(el);
          return;
        }
        hide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest("[data-tip]");
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, { passive: true });
      window.addEventListener("resize", fit);
      const themeButton = document.getElementById("theme");
      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.classList.toggle("dark");
        themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
      });
      render();
      document.fonts.ready.then(fit);
    </script>
