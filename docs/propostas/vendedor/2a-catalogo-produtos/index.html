<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Propostas: catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.97 0.002 260);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted: oklch(0.945 0.003 260);
        --muted-foreground: oklch(0.47 0.008 260);
        --brand: oklch(0.78 0.18 155);
        --brand-text: oklch(0.5 0.13 152);
        --brand-mark: oklch(0.62 0.16 152);
        --primary-foreground: oklch(0.2 0.015 250);
        --popover: oklch(1 0 0);
        --border: oklch(0 0 0 / 0.08);
        --mark: #ff2d2d;
      }
      :root.dark {
        --background: oklch(0.165 0.003 260);
        --foreground: oklch(0.97 0 0);
        --card: oklch(0.215 0.004 260);
        --muted: oklch(0.27 0.004 260);
        --muted-foreground: oklch(0.72 0.005 260);
        --brand: oklch(0.87 0.16 152);
        --brand-text: oklch(0.87 0.16 152);
        --brand-mark: oklch(0.87 0.16 152);
        --primary-foreground: oklch(0.18 0.02 160);
        --popover: oklch(0.24 0.004 260);
        --border: oklch(1 0 0 / 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .page {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .topbar h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .topbar p {
        margin: 4px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .toggle {
        border: 0;
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
      .proposal {
        margin-top: 36px;
      }
      .proposal-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
      }
      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
        font-size: 18px;
      }
      .proposal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 4px 0 14px;
        max-width: 820px;
        line-height: 1.5;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .frames .mobile-col {
        max-width: 390px;
      }

      .frame {
        border-radius: 20px;
        outline: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }
      .frame-label {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px 4px;
        font-weight: 600;
      }
      .desktop-fit {
        overflow: hidden;
      }
      .desktop {
        width: 1440px;
        transform-origin: 0 0;
      }
      .mobile {
        width: 390px;
        position: relative;
        height: 560px;
      }

      /* Header reproduction (top-nav.tsx) */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
      }
      .hdr .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted-foreground);
        white-space: nowrap;
        cursor: pointer;
        text-decoration: none;
      }
      .tab:hover {
        color: var(--foreground);
      }
      .tab.active {
        background: var(--foreground);
        color: var(--background);
      }
      .tab .ic {
        font-size: 18px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }
      .round {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .round:hover {
        color: var(--foreground);
      }
      .round .ic {
        font-size: 20px;
      }
      .round.labelled {
        padding: 0 16px 0 14px;
      }
      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152);
        color: oklch(0.18 0.02 160);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip .name {
        line-height: 1.2;
        white-space: nowrap;
      }
      .chip .name b {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .chip .name span {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .caret {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .content {
        padding: 20px 32px 28px;
      }
      .content h3 {
        font-size: 56px;
        letter-spacing: -0.03em;
        margin: 0;
        font-weight: 600;
      }
      .content p {
        color: var(--muted-foreground);
        margin: 6px 0 0;
        font-size: 14px;
      }

      /* Mobile */
      .m-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      .m-hdr .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sheet {
        position: absolute;
        inset: 76px auto 0 0;
        border-top-right-radius: 20px;
        width: 300px;
        background: var(--card);
        padding: 18px 14px;
        box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5);
      }
      .sheet .close {
        display: flex;
        justify-content: flex-end;
        color: var(--muted-foreground);
        font-size: 22px;
        margin-bottom: 18px;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 18px;
        font-weight: 500;
      }
      .m-item.active {
        background: var(--foreground);
        color: var(--background);
      }
      .m-item .ic {
        font-size: 22px;
      }
      .m-item .count {
        margin-left: 2px;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152 / 0.18);
        color: var(--brand-text);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* B: soft background behind the icon */
      .b .tab .ic,
      .b .m-item .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        font-size: 16px;
      }
      .b .tab {
        padding-left: 6px;
      }
      .b .tab.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .m-item {
        padding-left: 8px;
      }
      .b .m-item .ic {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .b .m-item.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .round.labelled .ic {
        font-size: 18px;
      }

      /* C: icon above the label */
      .c .tab {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 56px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 18px;
      }
      .c .nav {
        border-radius: 24px;
      }
      .c .tab .ic {
        font-size: 20px;
      }
      .c .round.stacked {
        flex-direction: column;
        gap: 2px;
        height: 68px;
        min-width: 64px;
        border-radius: 20px;
        font-size: 12px;
        padding: 0 8px;
      }
      .c .chip {
        border-radius: 24px;
      }
      .c .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .c .m-item {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        height: 84px;
        border-radius: 18px;
        background: var(--muted);
        font-size: 15px;
        padding: 0 8px;
      }
      .c .m-item.active {
        background: var(--foreground);
      }
      .c .m-item .ic {
        font-size: 24px;
      }

      /* Tooltip (components/ui/tooltip.tsx look) */
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--foreground);
        color: var(--background);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(2px) scale(0.97);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        left: var(--arrow, 50%);
        bottom: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--foreground);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .tip.below::after {
        bottom: auto;
        top: -4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 10px;
      }
      .legend b {
        color: var(--foreground);
        font-weight: 600;
      }

      .term {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: help;
      }
      /* Section 2a: catalog products (catalogo.tsx, catalog-product-card, selection-bar, bulk-publish-dialog) */
      .cat {
        padding: 8px 32px 32px;
        position: relative;
      }
      .cat-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .cat-head h3 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .cat-head p {
        margin: 6px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .ghost {
        height: 40px;
        border-radius: 999px;
        background: var(--card);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--foreground);
      }
      .ghost .ic {
        font-size: 16px;
      }
      .filters {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 20px;
      }
      .search {
        flex: 1;
        height: 40px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .search .ic {
        font-size: 16px;
      }
      .sel {
        height: 40px;
        min-width: 150px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        font-size: 14px;
      }
      .chk {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        white-space: nowrap;
      }
      .box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid oklch(0.6 0 0 / 0.5);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .box.on {
        background: oklch(0.8 0.17 152);
        border-color: transparent;
        color: oklch(0.18 0.02 160);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .pcard {
        border-radius: 24px;
        background: var(--card);
        overflow: hidden;
        position: relative;
      }
      .pcard.on {
        outline: 2px solid oklch(0.8 0.17 152);
      }
      .ph {
        height: 150px;
        background: oklch(0.5 0 0 / 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: var(--muted-foreground);
        position: relative;
      }
      .ph .corner {
        position: absolute;
        left: 14px;
        top: 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .ph .color {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        background: oklch(0 0 0 / 0.55);
        color: #fff;
        border-radius: 999px;
        padding: 3px 9px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .ph .color i {
        width: 9px;
        height: 9px;
        border-radius: 9px;
        display: inline-block;
      }
      .badge-pub {
        position: absolute;
        left: 12px;
        top: 12px;
        font-size: 12px;
        background: oklch(0 0 0 / 0.55);
        color: #fff;
        border-radius: 999px;
        padding: 4px 10px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .badge-pub .ic {
        color: oklch(0.8 0.17 152);
        font-size: 13px;
      }
      .ribbon {
        position: absolute;
        right: -36px;
        top: 18px;
        transform: rotate(45deg);
        background: oklch(0.55 0.22 27);
        color: #fff;
        font-size: 12px;
        padding: 4px 40px;
      }
      .pbody {
        padding: 14px 16px 16px;
      }
      .pbody .sup {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .pbody .tt {
        font-size: 14px;
        margin-top: 2px;
      }
      .pbody .pr {
        font-size: 18px;
        font-weight: 600;
        margin-top: 10px;
      }
      .pbody .meta {
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .pfoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--border);
        margin-top: 12px;
        padding-top: 10px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .pubbtn {
        height: 30px;
        border-radius: 999px;
        background: var(--muted);
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 500;
      }
      .pubbtn .ic {
        font-size: 14px;
      }
      .bar {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--popover);
        border-radius: 999px;
        padding: 6px 8px 6px 8px;
        box-shadow: 0 10px 30px oklch(0 0 0 / 0.4);
        font-size: 14px;
      }
      .bar .n {
        width: 24px;
        height: 24px;
        border-radius: 99px;
        background: oklch(0.8 0.17 152 / 0.2);
        color: var(--brand-text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      .bar .go {
        height: 32px;
        border-radius: 999px;
        background: oklch(0.8 0.17 152);
        color: oklch(0.18 0.02 160);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        font-weight: 500;
      }
      .bar .x {
        height: 32px;
        min-width: 32px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--muted-foreground);
        padding: 0 8px;
      }
      .dialog {
        width: 430px;
        border-radius: 24px;
        background: var(--popover);
        padding: 22px;
        margin: 30px auto 0;
        box-shadow: 0 20px 60px oklch(0 0 0 / 0.45);
        font-size: 14px;
      }
      .dialog h4 {
        margin: 0;
        font-size: 20px;
      }
      .dialog .sub {
        color: var(--muted-foreground);
        margin-top: 4px;
      }
      .dlabel {
        color: var(--muted-foreground);
        font-size: 13px;
        margin: 18px 0 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: oklch(0.5 0 0 / 0.08);
        border-radius: 16px;
        padding: 12px 14px;
      }
      .step {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--muted);
        border-radius: 999px;
        padding: 3px;
      }
      .step span.b {
        width: 30px;
        height: 30px;
        border-radius: 99px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      .nav2 {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted-foreground);
      }
      .nav2 span.b {
        width: 26px;
        height: 26px;
        border-radius: 99px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .rec {
        margin-top: 10px;
        display: grid;
        gap: 6px;
      }
      .rec div {
        display: flex;
        justify-content: space-between;
      }
      .rec i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 9px;
        margin-right: 8px;
      }
      .cta {
        margin-top: 16px;
        height: 44px;
        border-radius: 999px;
        background: oklch(0.8 0.17 152);
        color: oklch(0.18 0.02 160);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
      }
      .twocol {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 470px;
        gap: 20px;
        align-items: start;
      }
      .mob {
        padding: 14px;
        position: relative;
        padding-bottom: 80px;
      }
      .mob .filters {
        flex-wrap: wrap;
      }
      .mob .sel {
        flex: 1;
        min-width: 0;
      }
      .mob .grid {
        grid-template-columns: 1fr;
      }
      .mob .bar {
        bottom: 16px;
        font-size: 13px;
        gap: 6px;
        white-space: nowrap;
      }
      .bar {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div>
          <h1>Seção 2a · Catálogo: produtos (vendedor)</h1>
          <p>
            Partem do padrão escolhido (ícone pequeno ao lado do texto, ações com nome). Passe o
            mouse ou toque: caixinha do produto, Publicar, Ocultar publicados, X da barra, −/+, ‹/›
            e "Taxa do marketplace".
          </p>

          duotone:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M232,56V200a16,16,0,0,1-16,16H40a16,16,0,0,1-16-16V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56Z" opacity="0.2"></path><path d="M205.66,85.66l-96,96a8,8,0,0,1-11.32,0l-40-40a8,8,0,0,1,11.32-11.32L104,164.69l90.34-90.35a8,8,0,0,1,11.32,11.32Z"></path></svg>',
        },
        Storefront: {
          regular:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M232,96a7.89,7.89,0,0,0-.3-2.2L217.35,43.6A16.07,16.07,0,0,0,202,32H54A16.07,16.07,0,0,0,38.65,43.6L24.31,93.8A7.89,7.89,0,0,0,24,96h0v16a40,40,0,0,0,16,32v72a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V144a40,40,0,0,0,16-32V96ZM54,48H202l11.42,40H42.61Zm50,56h48v8a24,24,0,0,1-48,0Zm-16,0v8a24,24,0,0,1-35.12,21.26,7.88,7.88,0,0,0-1.82-1.06A24,24,0,0,1,40,112v-8ZM200,208H56V151.2a40.57,40.57,0,0,0,8,.8,40,40,0,0,0,32-16,40,40,0,0,0,64,0,40,40,0,0,0,32,16,40.57,40.57,0,0,0,8-.8Zm4.93-75.8a8.08,8.08,0,0,0-1.8,1.05A24,24,0,0,1,168,112v-8h48v8A24,24,0,0,1,204.93,132.2Z"></path></svg>',
          bold: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M236,96a12,12,0,0,0-.44-3.3L221.2,42.51A20.08,20.08,0,0,0,202,28H54A20.08,20.08,0,0,0,34.8,42.51L20.46,92.7A12,12,0,0,0,20,96h0v16a43.94,43.94,0,0,0,16,33.92V216a12,12,0,0,0,12,12H208a12,12,0,0,0,12-12V145.92A43.94,43.94,0,0,0,236,112V96ZM57.05,52H199l9.14,32H47.91Zm91,56v4a20,20,0,0,1-40,0v-4ZM53,128.71A20,20,0,0,1,44,112v-4H84v4a20,20,0,0,1-20,20,19.76,19.76,0,0,1-9.07-2.2A11.54,11.54,0,0,0,53,128.71ZM196,204H60V155.81c1.32.12,2.65.19,4,.19a43.86,43.86,0,0,0,32-13.85,43.89,43.89,0,0,0,64,0A43.86,43.86,0,0,0,192,156c1.35,0,2.68-.07,4-.19Zm16-92a20,20,0,0,1-9,16.71,11.66,11.66,0,0,0-1.88,1.09A20,20,0,0,1,172,112v-4h40Z"></path></svg>',
          fill: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M231.69,93.81,217.35,43.6A16.07,16.07,0,0,0,202,32H54A16.07,16.07,0,0,0,38.65,43.6L24.31,93.81A7.94,7.94,0,0,0,24,96v16a40,40,0,0,0,16,32v72a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V144a40,40,0,0,0,16-32V96A7.94,7.94,0,0,0,231.69,93.81ZM88,112a24,24,0,0,1-35.12,21.26,7.88,7.88,0,0,0-1.82-1.06A24,24,0,0,1,40,112v-8H88Zm64,0a24,24,0,0,1-48,0v-8h48Zm64,0a24,24,0,0,1-11.07,20.2,8.08,8.08,0,0,0-1.8,1.05A24,24,0,0,1,168,112v-8h48Z"></path></svg>',
          duotone:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,96v16a32,32,0,0,1-64,0V96H96v16a32,32,0,0,1-64,0V96L46.34,45.8A8,8,0,0,1,54,40H202a8,8,0,0,1,7.69,5.8Z" opacity="0.2"></path><path d="M231.69,93.81,217.35,43.6A16.07,16.07,0,0,0,202,32H54A16.07,16.07,0,0,0,38.65,43.6L24.31,93.81A7.94,7.94,0,0,0,24,96v16a40,40,0,0,0,16,32v72a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V144a40,40,0,0,0,16-32V96A7.94,7.94,0,0,0,231.69,93.81ZM54,48H202l11.42,40H42.61Zm98,56v8a24,24,0,0,1-48,0v-8ZM51.06,132.2A24,24,0,0,1,40,112v-8H88v8a24,24,0,0,1-35.12,21.26A7.88,7.88,0,0,0,51.06,132.2ZM200,208H56V151.2a40.57,40.57,0,0,0,8,.8,40,40,0,0,0,32-16,40,40,0,0,0,64,0,40,40,0,0,0,32,16,40.57,40.57,0,0,0,8-.8Zm16-96a24,24,0,0,1-11.07,20.2,8.08,8.08,0,0,0-1.8,1.05A24,24,0,0,1,168,112v-8h48Z"></path></svg>',
        },
      };
      const HINT = {
        select: "Marque para publicar vários produtos de uma vez",
        publish: "Publicar este produto em uma das suas lojas",
        publishMany: "Publicar os produtos marcados nas suas lojas",
        hidePublished: "Esconde os produtos que você já publicou",
        inStock: "Mostra só produtos que o fornecedor tem em estoque",
        bySupplier: "Ver os fornecedores e os produtos de cada um",
        clear: "Desmarcar todos os produtos",
        minus: "Diminuir o acréscimo",
        plus: "Aumentar o acréscimo",
        prev: "Ver o produto anterior",
        next: "Ver o próximo produto",
        fee: "Média do que o Mercado Livre cobra por venda; muda conforme a categoria",
        published: "Este produto já está à venda em uma das suas lojas",
        soldOut: "O fornecedor está sem estoque; não dá para publicar agora",
      };
      const PROPOSALS = [
        {
          key: "now",
          letter: "–",
          title: "Como está hoje",
          note: '"Publicar" usa o ícone de caixa (o mesmo da aba Catálogo) e "Publicar selecionados" usa um megafone: dois ícones para a mesma função. Caixinha, X, −/+ e ‹/› sem legenda. A busca fala em "SKU".',
        },
        {
          key: "a",
          letter: "A",
          title: "Só legendas",
          note: 'Um ícone só para "Publicar" (aviãozinho de papel), nos cartões e na barra. Legendas em todos os itens marcados. "SKU" vira "código" na busca. Nada muda de lugar.',
        },
        {
          key: "b",
          letter: "B",
          title: "Ações com texto (recomendada)",
          note: 'Como A, e as ações ganham nome onde hoje há só ícone: o X da barra vira "Limpar", e "Ver por fornecedor" ganha o ícone de fornecedor. −/+ e ‹/› continuam só com ícone (padrões universais), com legenda.',
        },
        {
          key: "c",
          letter: "C",
          title: "Seleção à vista",
          note: 'Como B, e a caixinha de cada cartão ganha a palavra "Selecionar" ao lado, para quem não sabe que dá para marcar vários produtos. Ocupa o canto do cartão, sobre a foto.',
        },
      ];
      const ic = (name, weight = "regular") => `<span class="ic">${ICONS[name][weight]}</span>`;
      const tipOf = (key, text) => (key === "now" ? "" : ` data-tip="${text}" tabindex="0"`);
      const publishIcon = (key, many) =>
        key === "now" ? ic(many ? "MegaphoneSimple" : "Package") : ic("PaperPlaneTilt");

      function header(key) {
        const glyph = key === "b" || key === "c" ? ic("Factory") : "";
        return `<div class="cat-head"><div><h3>Catálogo</h3><p>Produtos de fornecedores de todo o Brasil. Selecione vários para publicar de uma vez.</p></div><span class="ghost"${tipOf(key, HINT.bySupplier)}>${glyph}Ver por fornecedor</span></div>`;
      }
      function filters(key) {
        const placeholder =
          key === "now"
            ? "Buscar por produto, SKU ou fornecedor"
            : "Buscar por produto, código ou fornecedor";
        return `<div class="filters"><div class="search">${ic("MagnifyingGlass")}${placeholder}</div><div class="sel">Categorias ${ICONS.CaretDown.regular}</div><div class="sel">Fornecedores ${ICONS.CaretDown.regular}</div><div class="sel">Nome (A–Z) ${ICONS.CaretDown.regular}</div>
    <label class="chk"${tipOf(key, HINT.inStock)}><span class="box"></span>Só com estoque</label><label class="chk"${tipOf(key, HINT.hidePublished)}><span class="box"></span>Ocultar publicados</label></div>`;
      }
      function corner(key, selected) {
        const box = `<span class="box${selected ? " on" : ""}">${selected ? ICONS.Check.bold : ""}</span>`;
        const word = key === "c" ? "Selecionar" : "";
        return `<span class="corner"${tipOf(key, HINT.select)}>${box}${word}</span>`;
      }
      function card(key, opts) {
        const top = opts.published
          ? `<span class="badge-pub"${tipOf(key, HINT.published)}>${ic("CheckCircle", "fill")}Publicado</span>`
          : corner(key, opts.selected);
        const ribbon = opts.soldOut
          ? `<span class="ribbon"${tipOf(key, HINT.soldOut)}>Esgotado</span>`
          : "";
        const foot = opts.soldOut
          ? `<div class="pfoot" style="color:oklch(0.7 0.19 25)">Sem estoque no fornecedor</div>`
          : `<div class="pfoot"><span>${opts.stock} em estoque<br>atualizado ontem</span>${opts.published ? "" : `<span class="pubbtn"${tipOf(key, HINT.publish)}>${publishIcon(key, false)}Publicar</span>`}</div>`;
        return `<div class="pcard${opts.selected ? " on" : ""}"><div class="ph">${ICONS.TShirt.regular}${top}${ribbon}<span class="color"><i style="background:${opts.dot}"></i>${opts.color}</span></div>
    <div class="pbody"><div class="sup">Ateliê Divinópolis Confecções</div><div class="tt">${opts.title}</div><div class="pr">${opts.price}</div><div class="meta">${opts.meta}</div>${foot}</div></div>`;
      }
      const CARDS = [
        {
          title: "Blusa de tricô canelada - Branco",
          price: "R$ 79,90",
          meta: "custo R$ 34,85 · margem 42%",
          stock: 75,
          color: "Branco",
          dot: "#fff",
          selected: true,
        },
        {
          title: "Blusa de tricô canelada - Verde",
          price: "R$ 77,90",
          meta: "custo R$ 33,87 · margem 42%",
          color: "Verde",
          dot: "#22c55e",
          soldOut: true,
          published: true,
        },
        {
          title: "Body manga longa canelado - Bege",
          price: "R$ 68,90",
          meta: "custo R$ 35,75 · margem 34%",
          stock: 51,
          color: "Bege",
          dot: "#d6c3a3",
          published: true,
        },
        {
          title: "Body manga longa canelado - Rosa",
          price: "R$ 63,90",
          meta: "custo R$ 26,23 · margem 44%",
          stock: 9,
          color: "Rosa",
          dot: "#ec4899",
          selected: true,
        },
      ];
      function bar(key) {
        const clear =
          key === "b" || key === "c"
            ? `<span class="x"${tipOf(key, HINT.clear)}>${ICONS.X.regular}Limpar</span>`
            : `<span class="x"${tipOf(key, HINT.clear)} aria-label="Limpar seleção">${ICONS.X.regular}</span>`;
        return `<div class="bar"><span class="n">2</span>selecionados<span class="go"${tipOf(key, HINT.publishMany)}>${publishIcon(key, true)}Publicar selecionados</span>${clear}</div>`;
      }
      function dialog(key) {
        const fee =
          key === "now"
            ? "Taxa do marketplace (~14%)"
            : `<span class="term" data-tip="${HINT.fee}" tabindex="0">Taxa do marketplace (~14%)</span>`;
        return `<div class="dialog"><h4>Publicar 2 produtos</h4><div class="sub">Blusa de tricô canelada - Branco e Body manga longa…</div>
    <div class="dlabel">Onde publicar</div><div class="row"><span style="display:inline-flex;align-items:center;gap:10px">${ICONS.Storefront.regular} Ana Moda</span><span style="color:var(--brand-text)">Escolher ⌄</span></div>
    <div class="dlabel">Preço de venda</div><div class="row"><span>Acréscimo sobre o custo<br><small style="color:var(--muted-foreground)">Arredondado para ,90</small></span><span class="step"><span class="b"${tipOf(key, HINT.minus)}>${ICONS.Minus.regular}</span>60%<span class="b"${tipOf(key, HINT.plus)}>${ICONS.Plus.regular}</span></span></div>
    <div class="row" style="margin-top:8px;background:transparent;padding:6px 2px"><span style="color:var(--muted-foreground)">Blusa de tricô canelada - Branco</span><span class="nav2"><span class="b"${tipOf(key, HINT.prev)}>${ICONS.CaretLeft.regular}</span>1 de 2<span class="b"${tipOf(key, HINT.next)}>${ICONS.CaretRight.regular}</span></span></div>
    <div class="rec"><div><span><i style="background:oklch(0.7 0.1 250)"></i>Custo do fornecedor</span><span>R$ 34,85</span></div><div><span><i style="background:oklch(0.75 0.1 300)"></i>${fee}</span><span>R$ 7,83</span></div><div><span><i style="background:oklch(0.8 0.17 152)"></i>Seu lucro</span><span style="color:var(--brand-text)">R$ 13,22 (23%)</span></div></div>
    <div class="cta">${key === "now" ? "" : ic("PaperPlaneTilt")}Publicar em 1 loja</div></div>`;
      }
      function desktop(key) {
        return `<div class="cat">${header(key)}${filters(key)}<div class="twocol"><div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${CARDS.map((c) => card(key, c)).join("")}</div></div>${dialog(key)}</div>${bar(key)}</div>`;
      }
      function mobile(key) {
        return `<div class="mob">${header(key).replace('class="cat-head"', 'class="cat-head" style="flex-direction:column;gap:12px"')}<div class="filters"><div class="search" style="flex-basis:100%">${ic("MagnifyingGlass")}${key === "now" ? "Buscar por produto, SKU ou…" : "Buscar por produto, código ou…"}</div></div><div class="grid">${card(key, CARDS[0])}</div>${bar(key)}</div>`;
      }
      function render() {
        document.getElementById("root").innerHTML = PROPOSALS.map(
          (p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px (cartões, barra de seleção e janela "Publicar")</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`,
        ).join("");
        fit();
      }
      function fit() {
        document.querySelectorAll(".desktop-fit").forEach((box) => {
          const inner = box.firstElementChild;
          const scale = Math.min(1, box.clientWidth / 1440);
          inner.style.transform = `scale(${scale})`;
          box.style.height = `${inner.offsetHeight * scale}px`;
        });
      }
      // Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
      const tip = document.getElementById("tip");
      let timer = 0,
        current = null;
      function show(el) {
        current = el;
        tip.textContent = el.dataset.tip;
        tip.classList.remove("below");
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth,
          h = tip.offsetHeight;
        const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
        let left = Math.max(
          frame.left + 8,
          Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2),
        );
        let top = r.top - h - 10;
        if (top < 8) {
          top = r.bottom + 10;
          tip.classList.add("below");
        }
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
        tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
        tip.classList.add("on");
      }
      function hide() {
        clearTimeout(timer);
        current = null;
        tip.classList.remove("on");
      }
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el === current) return;
        hide();
        if (el) timer = setTimeout(() => show(el), 300);
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && el !== current) {
          hide();
          show(el);
          return;
        }
        hide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest("[data-tip]");
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, { passive: true });
      window.addEventListener("resize", fit);
      const themeButton = document.getElementById("theme");
      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.classList.toggle("dark");
        themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
      });
      render();
      document.fonts.ready.then(fit);
    </script>
  </body>
