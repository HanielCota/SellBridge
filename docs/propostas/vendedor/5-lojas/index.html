<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Propostas: lojas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.97 0.002 260);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted: oklch(0.945 0.003 260);
        --muted-foreground: oklch(0.47 0.008 260);
        --brand: oklch(0.78 0.18 155);
        --brand-text: oklch(0.5 0.13 152);
        --brand-mark: oklch(0.62 0.16 152);
        --primary-foreground: oklch(0.2 0.015 250);
        --popover: oklch(1 0 0);
        --border: oklch(0 0 0 / 0.08);
        --mark: #ff2d2d;
      }
      :root.dark {
        --background: oklch(0.165 0.003 260);
        --foreground: oklch(0.97 0 0);
        --card: oklch(0.215 0.004 260);
        --muted: oklch(0.27 0.004 260);
        --muted-foreground: oklch(0.72 0.005 260);
        --brand: oklch(0.87 0.16 152);
        --brand-text: oklch(0.87 0.16 152);
        --brand-mark: oklch(0.87 0.16 152);
        --primary-foreground: oklch(0.18 0.02 160);
        --popover: oklch(0.24 0.004 260);
        --border: oklch(1 0 0 / 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .page {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .topbar h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .topbar p {
        margin: 4px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .toggle {
        border: 0;
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
      .proposal {
        margin-top: 36px;
      }
      .proposal-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
      }
      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
        font-size: 18px;
      }
      .proposal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 4px 0 14px;
        max-width: 820px;
        line-height: 1.5;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .frames .mobile-col {
        max-width: 390px;
      }

      .frame {
        border-radius: 20px;
        outline: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }
      .frame-label {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px 4px;
        font-weight: 600;
      }
      .desktop-fit {
        overflow: hidden;
      }
      .desktop {
        width: 1440px;
        transform-origin: 0 0;
      }
      .mobile {
        width: 390px;
        position: relative;
        height: 560px;
      }

      /* Header reproduction (top-nav.tsx) */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
      }
      .hdr .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted-foreground);
        white-space: nowrap;
        cursor: pointer;
        text-decoration: none;
      }
      .tab:hover {
        color: var(--foreground);
      }
      .tab.active {
        background: var(--foreground);
        color: var(--background);
      }
      .tab .ic {
        font-size: 18px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }
      .round {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .round:hover {
        color: var(--foreground);
      }
      .round .ic {
        font-size: 20px;
      }
      .round.labelled {
        padding: 0 16px 0 14px;
      }
      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152);
        color: oklch(0.18 0.02 160);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip .name {
        line-height: 1.2;
        white-space: nowrap;
      }
      .chip .name b {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .chip .name span {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .caret {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .content {
        padding: 20px 32px 28px;
      }
      .content h3 {
        font-size: 56px;
        letter-spacing: -0.03em;
        margin: 0;
        font-weight: 600;
      }
      .content p {
        color: var(--muted-foreground);
        margin: 6px 0 0;
        font-size: 14px;
      }

      /* Mobile */
      .m-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      .m-hdr .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sheet {
        position: absolute;
        inset: 76px auto 0 0;
        border-top-right-radius: 20px;
        width: 300px;
        background: var(--card);
        padding: 18px 14px;
        box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5);
      }
      .sheet .close {
        display: flex;
        justify-content: flex-end;
        color: var(--muted-foreground);
        font-size: 22px;
        margin-bottom: 18px;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 18px;
        font-weight: 500;
      }
      .m-item.active {
        background: var(--foreground);
        color: var(--background);
      }
      .m-item .ic {
        font-size: 22px;
      }
      .m-item .count {
        margin-left: 2px;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152 / 0.18);
        color: var(--brand-text);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* B: soft background behind the icon */
      .b .tab .ic,
      .b .m-item .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        font-size: 16px;
      }
      .b .tab {
        padding-left: 6px;
      }
      .b .tab.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .m-item {
        padding-left: 8px;
      }
      .b .m-item .ic {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .b .m-item.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .round.labelled .ic {
        font-size: 18px;
      }

      /* C: icon above the label */
      .c .tab {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 56px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 18px;
      }
      .c .nav {
        border-radius: 24px;
      }
      .c .tab .ic {
        font-size: 20px;
      }
      .c .round.stacked {
        flex-direction: column;
        gap: 2px;
        height: 68px;
        min-width: 64px;
        border-radius: 20px;
        font-size: 12px;
        padding: 0 8px;
      }
      .c .chip {
        border-radius: 24px;
      }
      .c .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .c .m-item {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        height: 84px;
        border-radius: 18px;
        background: var(--muted);
        font-size: 15px;
        padding: 0 8px;
      }
      .c .m-item.active {
        background: var(--foreground);
      }
      .c .m-item .ic {
        font-size: 24px;
      }

      /* Tooltip (components/ui/tooltip.tsx look) */
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--foreground);
        color: var(--background);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(2px) scale(0.97);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        left: var(--arrow, 50%);
        bottom: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--foreground);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .tip.below::after {
        bottom: auto;
        top: -4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 10px;
      }
      .legend b {
        color: var(--foreground);
        font-weight: 600;
      }

      .term {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: help;
      }
      .wrap {
        padding: 8px 32px 32px;
        font-size: 14px;
        position: relative;
        min-height: 640px;
      }
      .tbl {
        border-radius: 24px;
        background: var(--card);
        padding: 0 20px;
      }
      .hd {
        display: grid;
        grid-template-columns: 1fr 110px 90px 110px 140px;
        color: var(--muted-foreground);
        font-size: 13px;
        padding: 0 20px 8px;
      }
      .row8 {
        display: grid;
        grid-template-columns: 1fr 110px 90px 110px 140px;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      .row8:last-child {
        border-bottom: 0;
      }
      .who {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .lg {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: oklch(0.8 0.17 152 / 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--brand-text);
        font-size: 20px;
        position: relative;
        flex: none;
      }
      .lg i {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 10px;
        height: 10px;
        border-radius: 9px;
        background: oklch(0.75 0.17 152);
        border: 2px solid var(--card);
      }
      .who p {
        margin: 2px 0 0;
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .num {
        text-align: right;
        font-weight: 600;
      }
      .dots8 {
        justify-self: end;
        height: 32px;
        min-width: 32px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--muted-foreground);
        padding: 0 8px;
        background: oklch(0.5 0 0 / 0.1);
      }
      .menu8 {
        position: absolute;
        right: 32px;
        top: 250px;
        width: 300px;
        border-radius: 16px;
        background: var(--popover);
        box-shadow: 0 16px 40px oklch(0 0 0 / 0.45);
        padding: 10px;
        font-size: 13px;
        z-index: 3;
      }
      .menu8 .kv {
        display: flex;
        justify-content: space-between;
        padding: 3px 4px;
        color: var(--muted-foreground);
      }
      .menu8 .kv b {
        color: var(--foreground);
        font-weight: 500;
      }
      .menu8 hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 8px 0;
      }
      .menu8 .it {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 4px;
        font-size: 14px;
      }
      .menu8 .it .ic {
        display: inline-flex;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        background: oklch(0.5 0 0 / 0.15);
      }
      .menu8 .it.danger {
        color: oklch(0.72 0.18 25);
      }
      .pubrow {
        height: 30px;
        border-radius: 999px;
        background: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        font-size: 12px;
        margin-left: auto;
      }
      .mob {
        padding: 14px;
        font-size: 14px;
        position: relative;
      }
      .mob .row8 {
        grid-template-columns: 1fr auto;
      }
      .mob .row8 .num {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div>
          <h1>Seção 5 · Lojas (vendedor)</h1>
          <p>
            Passe o mouse ou toque no "⋯", no ponto verde, em "Publicações" e nos itens do menu.
          </p>
        </div>
        <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
      </div>
      <div id="root"></div>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>

      const HINT = {
        menu: "Ver a saúde da loja, publicar, trocar fornecedor ou desconectar",
        live: "Conectada: a loja está recebendo pedidos",
        listings: "Quantos produtos estão publicados nesta loja",
        sync: "Última vez que o SellBridge atualizou estoque e preço nesta loja",
        orderPing: "Última vez que o marketplace avisou de um pedido novo",
        publish: "Colocar à venda nas suas lojas",
        seeListings: "Ver os produtos publicados nesta loja",
        disconnect: "Para de sincronizar esta loja; os anúncios continuam no marketplace",
      };
      const PROPOSALS = [
        {
          key: "now",
          letter: "–",
          title: "Como está hoje",
          note: '"⋯" só com ícone; o ponto verde não explica o status. No menu, "Publicar produtos" usa a caixa (ícone do Catálogo), "Ver publicações" usa a loja (ícone de Lojas) e "Desconectar" usa o mesmo ícone de "Sair da conta".',
        },
        {
          key: "a",
          letter: "A",
          title: "Ícones certos e legendas",
          note: 'Cada item do menu passa a usar o ícone da sua função no dicionário: avião (publicar), megafone (publicações), tomada (desconectar, diferente de sair). Legendas no "⋯", no ponto verde, em "Publicações", nos termos da saúde da loja e em "Desconectar".',
        },
        {
          key: "b",
          letter: "B",
          title: "Status à vista (recomendada)",
          note: 'Como A, e o "⋯" mostra o status em palavra ("• Conectada"), como já fizemos em Publicações.',
        },
        {
          key: "c",
          letter: "C",
          title: "Ações à mostra",
          note: 'Como A, e "Publicar produtos" sai do menu e vira um botão em cada linha de loja.',
        },
      ];
      const ic = (n) => `<span class="ic">${ICONS[n].regular}</span>`;
      const tipOf = (k, t) => (k === "now" ? "" : ` data-tip="${t}" tabindex="0"`);
      const term = (k, text, h) =>
        k === "now" ? text : `<span class="term" data-tip="${h}" tabindex="0">${text}</span>`;
      function dots(k) {
        if (k === "b")
          return `<span class="dots8"${tipOf(k, HINT.menu)}><span style="width:7px;height:7px;border-radius:9px;background:oklch(0.75 0.17 152)"></span><span style="color:var(--brand-text)">Conectada</span>${ICONS.DotsThree.bold}</span>`;
        return `<span class="dots8"${tipOf(k, HINT.menu)}>${ICONS.DotsThree.bold}</span>`;
      }
      function row(k, name, supplier, pubs, sales, rev) {
        const pub =
          k === "c"
            ? `<span class="pubrow"${tipOf(k, HINT.publish)}>${ic("PaperPlaneTilt")}Publicar</span>`
            : "";
        return `<div class="row8"><div class="who"><span class="lg">${ICONS.Flask.regular}<i${tipOf(k, HINT.live)}></i></span><div><b>${name}</b><p>Loja simulada · Conectada anteontem</p><p>Vende <b style="color:var(--foreground)">${supplier}</b></p></div>${pub}</div><span class="num">${pubs}</span><span class="num">${sales}</span><span class="num">${rev}</span>${dots(k)}</div>`;
      }
      function menu(k) {
        const pubIc = k === "now" ? "Package" : "PaperPlaneTilt";
        const seeIc = k === "now" ? "Storefront" : "MegaphoneSimple";
        const offIc = k === "now" ? "SignOut" : "Plugs";
        const pubItem =
          k === "c"
            ? ""
            : `<div class="it"${tipOf(k, HINT.publish)}>${ic(pubIc)}Publicar produtos</div>`;
        return `<div class="menu8"><div style="display:flex;justify-content:space-between"><b>Ana Casa &amp; Beleza</b><span style="color:var(--brand-text)">• Conectada</span></div><hr><b>Saúde da loja</b><div class="kv"><span>${term(k, "Última sincronização", HINT.sync)}</span><b>anteontem</b></div><div class="kv"><span>${term(k, "Último aviso de pedido", HINT.orderPing)}</span><b>Ainda não houve</b></div><hr>${pubItem}<div class="it"${tipOf(k, HINT.seeListings)}>${ic(seeIc)}Ver publicações</div><div class="it">${ic("ArrowsLeftRight")}Trocar fornecedor</div><div class="it">${ic("ChatCircleDots")}Falar com o suporte</div><hr><div class="it danger"${tipOf(k, HINT.disconnect)}>${ic(offIc)}Desconectar</div></div>`;
      }
      function desktop(k) {
        return `<div class="wrap"><div class="hd"><span>Lojas · 2</span><span style="text-align:right">${term(k, "Publicações", HINT.listings)}</span><span style="text-align:right">Vendas</span><span style="text-align:right">Receita</span><span></span></div><div class="tbl">${row(k, "Ana Casa &amp; Beleza", "BH Beauty Distribuidora", 5, 48, "R$ 3.684")}${row(k, "Ana Moda", "Ateliê Divinópolis", 7, 45, "R$ 4.970")}</div>${menu(k)}</div>`;
      }
      function mobile(k) {
        return `<div class="mob"><div class="tbl">${row(k, "Ana Casa &amp; Beleza", "BH Beauty Distribuidora", 5, 48, "R$ 3.684")}</div></div>`;
      }
      function render() {
        document.getElementById("root").innerHTML = PROPOSALS.map(
          (p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px (lista e menu ⋯ aberto)</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`,
        ).join("");
        fit();
      }
      function fit() {
        document.querySelectorAll(".desktop-fit").forEach((box) => {
          const inner = box.firstElementChild;
          const scale = Math.min(1, box.clientWidth / 1440);
          inner.style.transform = `scale(${scale})`;
          box.style.height = `${inner.offsetHeight * scale}px`;
        });
      }
      // Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
      const tip = document.getElementById("tip");
      let timer = 0,
        current = null;
      function show(el) {
        current = el;
        tip.textContent = el.dataset.tip;
        tip.classList.remove("below");
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth,
          h = tip.offsetHeight;
        const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
        let left = Math.max(
          frame.left + 8,
          Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2),
        );
        let top = r.top - h - 10;
        if (top < 8) {
          top = r.bottom + 10;
          tip.classList.add("below");
        }
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
        tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
        tip.classList.add("on");
      }
      function hide() {
        clearTimeout(timer);
        current = null;
        tip.classList.remove("on");
      }
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el === current) return;
        hide();
        if (el) timer = setTimeout(() => show(el), 300);
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && el !== current) {
          hide();
          show(el);
          return;
        }
        hide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest("[data-tip]");
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, { passive: true });
      window.addEventListener("resize", fit);
      const themeButton = document.getElementById("theme");
      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.classList.toggle("dark");
        themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
      });
      render();
      document.fonts.ready.then(fit);
    </script>
