<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Propostas: publicações</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: oklch(0.97 0.002 260); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.945 0.003 260); --muted-foreground: oklch(0.47 0.008 260); --brand: oklch(0.78 0.18 155);
    --brand-text: oklch(0.5 0.13 152); --brand-mark: oklch(0.62 0.16 152); --primary-foreground: oklch(0.2 0.015 250);
    --popover: oklch(1 0 0); --border: oklch(0 0 0 / 0.08); --mark: #ff2d2d;
  }
  :root.dark {
    --background: oklch(0.165 0.003 260); --foreground: oklch(0.97 0 0); --card: oklch(0.215 0.004 260);
    --muted: oklch(0.27 0.004 260); --muted-foreground: oklch(0.72 0.005 260); --brand: oklch(0.87 0.16 152);
    --brand-text: oklch(0.87 0.16 152); --brand-mark: oklch(0.87 0.16 152); --primary-foreground: oklch(0.18 0.02 160);
    --popover: oklch(0.24 0.004 260); --border: oklch(1 0 0 / 0.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .page { max-width: 1520px; margin: 0 auto; padding: 24px 24px 80px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .topbar p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 14px; }
  .toggle { border: 0; border-radius: 999px; background: var(--card); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; }
  .proposal { margin-top: 36px; }
  .proposal-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--foreground); color: var(--background); font-weight: 800; font-size: 18px; }
  .proposal-head h2 { font-size: 18px; margin: 0; }
  .note { color: var(--muted-foreground); font-size: 14px; margin: 4px 0 14px; max-width: 820px; line-height: 1.5; }
  .frames { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  .frames .mobile-col { max-width: 390px; }

  .frame { border-radius: 20px; outline: 1px solid var(--border); background: var(--background); overflow: hidden; }
  .frame-label { font-size: 12px; color: var(--muted-foreground); margin: 0 0 6px 4px; font-weight: 600; }
  .desktop-fit { overflow: hidden; }
  .desktop { width: 1440px; transform-origin: 0 0; }
  .mobile { width: 390px; position: relative; height: 560px; }

  /* Header reproduction (top-nav.tsx) */
  .hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 16px 32px; }
  .hdr .left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; }
  .nav { position: relative; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--card); padding: 6px; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 16px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--foreground); }
  .tab.active { background: var(--foreground); color: var(--background); }
  .tab .ic { font-size: 18px; }
  .right { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .round { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; min-width: 44px; border-radius: 999px; background: var(--card); color: var(--muted-foreground); font-size: 14px; font-weight: 500; border: 0; font-family: inherit; cursor: pointer; }
  .round:hover { color: var(--foreground); }
  .round .ic { font-size: 20px; }
  .round.labelled { padding: 0 16px 0 14px; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: var(--primary-foreground); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 10px; border-radius: 999px; background: var(--card); padding: 6px; }
  .avatar { width: 40px; height: 40px; border-radius: 999px; background: oklch(0.87 0.16 152); color: oklch(0.18 0.02 160); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .chip .name { line-height: 1.2; white-space: nowrap; }
  .chip .name b { display: block; font-size: 16px; font-weight: 500; }
  .chip .name span { font-size: 14px; color: var(--muted-foreground); }
  .caret { width: 40px; height: 40px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 18px; }
  .content { padding: 20px 32px 28px; }
  .content h3 { font-size: 56px; letter-spacing: -0.03em; margin: 0; font-weight: 600; }
  .content p { color: var(--muted-foreground); margin: 6px 0 0; font-size: 14px; }

  /* Mobile */
  .m-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .m-hdr .group { display: flex; align-items: center; gap: 8px; }
  .sheet { position: absolute; inset: 76px auto 0 0; border-top-right-radius: 20px; width: 300px; background: var(--card); padding: 18px 14px; box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5); }
  .sheet .close { display: flex; justify-content: flex-end; color: var(--muted-foreground); font-size: 22px; margin-bottom: 18px; }
  .m-item { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 999px; color: var(--muted-foreground); font-size: 18px; font-weight: 500; }
  .m-item.active { background: var(--foreground); color: var(--background); }
  .m-item .ic { font-size: 22px; }
  .m-item .count { margin-left: 2px; min-width: 22px; height: 22px; border-radius: 999px; background: oklch(0.87 0.16 152 / 0.18); color: var(--brand-text); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

  /* B: soft background behind the icon */
  .b .tab .ic, .b .m-item .ic { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--muted); font-size: 16px; }
  .b .tab { padding-left: 6px; }
  .b .tab.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .m-item { padding-left: 8px; }
  .b .m-item .ic { width: 34px; height: 34px; font-size: 19px; }
  .b .m-item.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .round.labelled .ic { font-size: 18px; }

  /* C: icon above the label */
  .c .tab { flex-direction: column; justify-content: center; gap: 2px; height: 56px; padding: 0 14px; font-size: 13px; border-radius: 18px; }
  .c .nav { border-radius: 24px; }
  .c .tab .ic { font-size: 20px; }
  .c .round.stacked { flex-direction: column; gap: 2px; height: 68px; min-width: 64px; border-radius: 20px; font-size: 12px; padding: 0 8px; }
  .c .chip { border-radius: 24px; }
  .c .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .c .m-item { flex-direction: column; justify-content: center; gap: 6px; height: 84px; border-radius: 18px; background: var(--muted); font-size: 15px; padding: 0 8px; }
  .c .m-item.active { background: var(--foreground); }
  .c .m-item .ic { font-size: 24px; }

  /* Tooltip (components/ui/tooltip.tsx look) */
  .tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: var(--foreground); color: var(--background); font-size: 12px; line-height: 1.35; padding: 6px 12px; border-radius: 8px; opacity: 0; transform: translateY(2px) scale(0.97); transition: opacity 120ms, transform 120ms; }
  .tip.on { opacity: 1; transform: none; }
  .tip::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -4px; width: 10px; height: 10px; margin-left: -5px; background: var(--foreground); transform: rotate(45deg); border-radius: 2px; }
  .tip.below::after { bottom: auto; top: -4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted-foreground); font-size: 13px; margin-top: 10px; }
  .legend b { color: var(--foreground); font-weight: 600; }

  .term { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  .wrap { padding: 8px 32px 32px; position: relative; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .head h3 { margin: 0; font-size: 28px; font-weight: 600; }
  .head p { margin: 6px 0 0; color: var(--muted-foreground); font-size: 14px; }
  .cta2 { height: 40px; border-radius: 999px; background: oklch(0.8 0.17 152); color: oklch(0.18 0.02 160); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 500; font-size: 14px; }
  .bar2 { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 14px; }
  .tabs { display: flex; gap: 2px; background: var(--card); border-radius: 999px; padding: 4px; }
  .tabs { overflow-x: auto; white-space: nowrap; max-width: 100%; }
  .tabs span { flex: none; height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; color: var(--muted-foreground); }
  .tabs span.on { background: var(--foreground); color: var(--background); }
  .tabs small { opacity: 0.7; }
  .right2 { display: flex; gap: 10px; }
  .sel2 { height: 40px; min-width: 170px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
  .srch { height: 40px; width: 260px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted-foreground); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
  .lc { border-radius: 24px; background: var(--card); font-size: 13px; position: relative; }
  .lc .ph3 { border-radius: 24px 24px 0 0; }
  .lc .ph3 { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--muted-foreground); background: oklch(0.5 0 0 / 0.08); position: relative; }
  .box3 { position: absolute; left: 14px; top: 14px; width: 16px; height: 16px; border-radius: 4px; border: 1px solid oklch(0.6 0 0 / 0.5); }
  .dots { position: absolute; right: 12px; top: 10px; height: 30px; min-width: 30px; border-radius: 999px; background: oklch(0 0 0 / 0.45); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; padding: 0 6px; }
  .dots .st { width: 8px; height: 8px; border-radius: 9px; background: oklch(0.8 0.17 152); position: absolute; right: -1px; top: -1px; }
  .dots.word { padding: 0 10px 0 8px; font-size: 12px; }
  .dots.word .st { position: static; }
  .lc .bd3 { padding: 14px 16px; }
  .lc .sup3 { color: var(--muted-foreground); font-size: 12px; }
  .lc .pr3 { font-size: 18px; font-weight: 600; margin-top: 8px; }
  .lc .meta3 { color: var(--muted-foreground); }
  .lc .sales { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted-foreground); }
  .lc .sales svg { width: 90px; height: 22px; color: oklch(0.8 0.17 152); }
  .lc .ft3 { display: flex; justify-content: space-between; border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; color: var(--muted-foreground); }
  .lc .ft3 i { display: inline-block; width: 7px; height: 7px; border-radius: 9px; background: oklch(0.8 0.17 152); margin-right: 6px; }
  .menu { position: absolute; right: 12px; top: 44px; width: 240px; border-radius: 16px; background: var(--popover); box-shadow: 0 16px 40px oklch(0 0 0 / 0.45); padding: 6px; font-size: 14px; z-index: 3; }
  .menu .it { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; }
  .menu .it .ic { font-size: 16px; color: var(--muted-foreground); }
  .menu .sub { color: var(--muted-foreground); font-size: 12px; margin-top: 2px; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  .menu .lbl { color: var(--muted-foreground); font-size: 12px; padding: 6px 10px 2px; }
  .ep { width: 400px; border-radius: 22px; background: var(--popover); padding: 20px; font-size: 14px; box-shadow: 0 20px 60px oklch(0 0 0 / 0.45); }
  .ep h4 { margin: 0; font-size: 18px; }
  .ep .val { margin-top: 12px; border-radius: 16px; border: 1px solid var(--border); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 600; }
  .ep .val small { font-size: 12px; color: var(--brand-text); background: oklch(0.8 0.17 152 / 0.15); border-radius: 999px; padding: 3px 9px; font-weight: 500; }
  .ep .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .ep .chips span { border-radius: 12px; background: oklch(0.5 0 0 / 0.1); text-align: center; padding: 8px 4px; font-size: 12px; }
  .ep .split { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; border-radius: 12px; background: oklch(0.5 0 0 / 0.08); padding: 10px; font-size: 12px; color: var(--muted-foreground); }
  .ep .split b { display: block; color: var(--foreground); font-size: 14px; }
  .twin { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start; margin-top: 18px; }
  .mob { padding: 14px; }
  .mob .grid3 { grid-template-columns: 1fr; }
  .mob .bar2 { flex-direction: column; align-items: stretch; gap: 10px; }
  .mob .srch { width: auto; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1>Seção 3a · Publicações: lista (vendedor)</h1>
      <p>Passe o mouse ou toque: "⋯", ponto de status, caixinha, "8 vendas em 30 dias", "Com erro", itens do menu e "saudável" / "Taxa 14%" na janela Editar preço.</p>
    </div>
    <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
  </div>
  <div id="root"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

const HINT = {
  actions: "Editar preço, pausar e outras ações deste anúncio",
  live: "No ar: o anúncio está à venda",
  select: "Marque para mudar vários anúncios de uma vez",
  sales: "Pedidos deste anúncio nos últimos 30 dias",
  errors: "Anúncios que o marketplace recusou; abra para ver o motivo",
  publish: "Escolher produtos no Catálogo para colocar à venda",
  editPrice: "Mudar o preço de venda deste anúncio",
  pause: "Tira o anúncio do ar até você reativar",
  simulate: "Cria um pedido de teste; não cobra ninguém",
  support: "Abrir um chamado sobre este anúncio",
  healthy: "Margem acima de 30%: sobra lucro depois das taxas",
  fee: "Média do que o Mercado Livre cobra por venda; muda conforme a categoria",
};
const PROPOSALS = [
  { key: "now", letter: "–", title: "Como está hoje", note: "\"⋯\" só com ícone e um ponto colorido de status sem explicação. \"Publicar produtos\" sem ícone. No menu, \"Simular venda\" usa o ícone de frasco, sem dizer que é um teste. Na janela, \"saudável\" e \"Taxa 14%\" sem explicação." },
  { key: "a", letter: "A", title: "Só legendas", note: "Legendas no \"⋯\", no ponto de status, na caixinha, nas vendas, em \"Com erro\", nos itens do menu, em \"saudável\" e na taxa. \"Publicar produtos\" ganha o ícone único de publicar. Nada muda de lugar." },
  { key: "b", letter: "B", title: "Status à vista (recomendada)", note: "Como A, e o botão \"⋯\" mostra o status em palavra ao lado do ponto (\"• No ar\", \"• Pausado\", \"• Com erro\"), para não depender de cor. O menu ganha uma linha curta embaixo de \"Simular venda\" dizendo que é um teste." },
  { key: "c", letter: "C", title: "Ações à mostra", note: "Como A, e \"Editar preço\" sai do menu e vira um botão no próprio cartão, ao lado das vendas. O menu \"⋯\" fica com o resto. Mais rápido para a ação mais usada, mas cada cartão ganha um botão." },
];
const ic = (name, weight = "regular") => `<span class="ic">${ICONS[name][weight]}</span>`;
const tipOf = (key, text) => (key === "now" ? "" : ` data-tip="${text}" tabindex="0"`);
const spark = `<svg viewBox="0 0 90 22" fill="none"><path d="M2 18 H20 L26 12 L30 18 H44 L50 6 L54 18 H64 L70 12 L74 18 H88" stroke="currentColor" stroke-width="1.6"/></svg>`;

function dots(key) {
  if (key === "b") return `<span class="dots word"${tipOf(key, HINT.actions)}><span class="st"${tipOf(key, HINT.live)}></span>No ar ${ICONS.DotsThree.bold}</span>`;
  return `<span class="dots"${tipOf(key, HINT.actions)}>${ICONS.DotsThree.bold}<span class="st"${tipOf(key, HINT.live)}></span></span>`;
}
function card(key, title, price, meta, sales, store, stock, withMenu) {
  const editBtn = key === "c" ? `<span class="pbtn"${tipOf(key, HINT.editPrice)} style="height:28px;border-radius:999px;background:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:var(--foreground);font-size:12px">${ic("Tag")}Editar preço</span>` : spark;
  const menu = withMenu ? menuHtml(key) : "";
  return `<div class="lc"><div class="ph3">${ICONS.Sparkle.regular}<span class="box3"${tipOf(key, HINT.select)}></span>${dots(key)}${menu}</div><div class="bd3"><div class="sup3">BH Beauty Distribuidora</div><div>${title}</div><div class="pr3">${price}</div><div class="meta3">${meta}</div><div class="sales"><span${tipOf(key, HINT.sales)}>${sales} vendas em 30 dias</span>${editBtn}</div><div class="ft3"><span><i></i>No ar na ${store}</span><span>${stock} em estoque</span></div></div></div>`;
}
function menuHtml(key) {
  const edit = key === "c" ? "" : `<div class="it"${tipOf(key, HINT.editPrice)}>${ic("Tag")}Editar preço</div>`;
  const simulateSub = key === "b" ? '<div class="sub">Teste: cria um pedido sem cobrar ninguém</div>' : "";
  return `<div class="menu">${edit}<div class="it"${tipOf(key, HINT.pause)}>${ic("Pause", "fill")}Pausar</div><hr><div class="lbl">Lojas</div><div class="it">${ic("Storefront")}Ana Casa &amp; Beleza</div><hr><div class="it"${tipOf(key, HINT.simulate)}>${ic("Flask")}<div>Simular venda${simulateSub}</div></div><hr><div class="it"${tipOf(key, HINT.support)}>${ic("ChatCircleDots")}Falar com o suporte</div></div>`;
}
function editPrice(key) {
  const healthy = key === "now" ? "<small>54% · saudável</small>" : `<small class="term" data-tip="${HINT.healthy}" tabindex="0">54% · saudável</small>`;
  const fee = key === "now" ? "Taxa 14%" : `<span class="term" data-tip="${HINT.fee}" tabindex="0">Taxa 14%</span>`;
  return `<div class="ep"><h4>Editar preço</h4><div style="color:var(--muted-foreground);margin-top:4px">Hidratante labial FPS 15 - Rosa · Vale para 1 loja</div><div class="val">R$ 16,90 ${healthy}</div><div class="chips"><span>10%<br>R$ 7,90</span><span>25%<br>R$ 8,90</span><span>40%<br>R$ 11,90</span><span>55%<br>R$ 17,90</span></div><div class="split"><span>Custo<b>R$ 5,33</b></span><span>${fee}<b>R$ 2,37</b></span><span>Lucro<b style="color:var(--brand-text)">R$ 9,20</b></span></div></div>`;
}
function toolbar(key) {
  const errors = key === "now" ? "<span>Com erro <small>0</small></span>" : `<span${tipOf(key, HINT.errors)}>Com erro <small>0</small></span>`;
  return `<div class="bar2"><div class="tabs"><span class="on">Todas <small>12</small></span><span>No ar <small>12</small></span>${errors}<span>Pausadas <small>0</small></span></div><div class="right2"><div class="sel2">Mais recentes ${ICONS.CaretDown.regular}</div><div class="srch">${ic("MagnifyingGlass")}Buscar produto</div></div></div>`;
}
function desktop(key) {
  const cta = `<span class="cta2"${tipOf(key, HINT.publish)}>${key === "now" ? "" : ic("PaperPlaneTilt")}Publicar produtos</span>`;
  return `<div class="wrap"><div class="head"><div><h3>Publicações</h3><p>Seus produtos e onde cada um está no ar.</p></div>${cta}</div>${toolbar(key)}<div class="twin"><div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0">${card(key, "Hidratante labial FPS 15 - Rosa", "R$ 16,90", "custo R$ 5,33 · margem 54%", 8, "Ana Casa &amp; Beleza", 57, true)}${card(key, "Óleo corporal amêndoas 200 ml", "R$ 28,90", "custo R$ 12,46 · margem 42%", 13, "Ana Casa &amp; Beleza", 110, false)}</div>${editPrice(key)}</div></div>`;
}
function mobile(key) {
  return `<div class="mob">${toolbar(key)}<div class="grid3">${card(key, "Hidratante labial FPS 15 - Rosa", "R$ 16,90", "custo R$ 5,33 · margem 54%", 8, "Ana Casa &amp; Beleza", 57, false)}</div></div>`;
}
function render() {
  document.getElementById("root").innerHTML = PROPOSALS.map((p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px (cartões com menu aberto e janela Editar preço)</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`).join("");
  fit();
}
function fit() {
  document.querySelectorAll(".desktop-fit").forEach((box) => {
    const inner = box.firstElementChild;
    const scale = Math.min(1, box.clientWidth / 1440);
    inner.style.transform = `scale(${scale})`;
    box.style.height = `${inner.offsetHeight * scale}px`;
  });
}
// Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
const tip = document.getElementById("tip");
let timer = 0, current = null;
function show(el) {
  current = el;
  tip.textContent = el.dataset.tip;
  tip.classList.remove("below");
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
  let left = Math.max(frame.left + 8, Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2));
  let top = r.top - h - 10;
  if (top < 8) { top = r.bottom + 10; tip.classList.add("below"); }
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
  tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
  tip.classList.add("on");
}
function hide() { clearTimeout(timer); current = null; tip.classList.remove("on"); }
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el === current) return;
  hide();
  if (el) timer = setTimeout(() => show(el), 300);
});
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el && el !== current) { hide(); show(el); return; }
  hide();
});
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
document.addEventListener("focusout", hide);
window.addEventListener("scroll", hide, { passive: true });
window.addEventListener("resize", fit);
const themeButton = document.getElementById("theme");
themeButton.addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
});
render();
document.fonts.ready.then(fit);
</script>
</body>
</html>
