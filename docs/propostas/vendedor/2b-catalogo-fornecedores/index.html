<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Propostas: fornecedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: oklch(0.97 0.002 260); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.945 0.003 260); --muted-foreground: oklch(0.47 0.008 260); --brand: oklch(0.78 0.18 155);
    --brand-text: oklch(0.5 0.13 152); --brand-mark: oklch(0.62 0.16 152); --primary-foreground: oklch(0.2 0.015 250);
    --popover: oklch(1 0 0); --border: oklch(0 0 0 / 0.08); --mark: #ff2d2d;
  }
  :root.dark {
    --background: oklch(0.165 0.003 260); --foreground: oklch(0.97 0 0); --card: oklch(0.215 0.004 260);
    --muted: oklch(0.27 0.004 260); --muted-foreground: oklch(0.72 0.005 260); --brand: oklch(0.87 0.16 152);
    --brand-text: oklch(0.87 0.16 152); --brand-mark: oklch(0.87 0.16 152); --primary-foreground: oklch(0.18 0.02 160);
    --popover: oklch(0.24 0.004 260); --border: oklch(1 0 0 / 0.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .page { max-width: 1520px; margin: 0 auto; padding: 24px 24px 80px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .topbar p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 14px; }
  .toggle { border: 0; border-radius: 999px; background: var(--card); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; }
  .proposal { margin-top: 36px; }
  .proposal-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--foreground); color: var(--background); font-weight: 800; font-size: 18px; }
  .proposal-head h2 { font-size: 18px; margin: 0; }
  .note { color: var(--muted-foreground); font-size: 14px; margin: 4px 0 14px; max-width: 820px; line-height: 1.5; }
  .frames { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  .frames .mobile-col { max-width: 390px; }

  .frame { border-radius: 20px; outline: 1px solid var(--border); background: var(--background); overflow: hidden; }
  .frame-label { font-size: 12px; color: var(--muted-foreground); margin: 0 0 6px 4px; font-weight: 600; }
  .desktop-fit { overflow: hidden; }
  .desktop { width: 1440px; transform-origin: 0 0; }
  .mobile { width: 390px; position: relative; height: 560px; }

  /* Header reproduction (top-nav.tsx) */
  .hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 16px 32px; }
  .hdr .left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; }
  .nav { position: relative; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--card); padding: 6px; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 16px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--foreground); }
  .tab.active { background: var(--foreground); color: var(--background); }
  .tab .ic { font-size: 18px; }
  .right { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .round { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; min-width: 44px; border-radius: 999px; background: var(--card); color: var(--muted-foreground); font-size: 14px; font-weight: 500; border: 0; font-family: inherit; cursor: pointer; }
  .round:hover { color: var(--foreground); }
  .round .ic { font-size: 20px; }
  .round.labelled { padding: 0 16px 0 14px; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: var(--primary-foreground); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 10px; border-radius: 999px; background: var(--card); padding: 6px; }
  .avatar { width: 40px; height: 40px; border-radius: 999px; background: oklch(0.87 0.16 152); color: oklch(0.18 0.02 160); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .chip .name { line-height: 1.2; white-space: nowrap; }
  .chip .name b { display: block; font-size: 16px; font-weight: 500; }
  .chip .name span { font-size: 14px; color: var(--muted-foreground); }
  .caret { width: 40px; height: 40px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 18px; }
  .content { padding: 20px 32px 28px; }
  .content h3 { font-size: 56px; letter-spacing: -0.03em; margin: 0; font-weight: 600; }
  .content p { color: var(--muted-foreground); margin: 6px 0 0; font-size: 14px; }

  /* Mobile */
  .m-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .m-hdr .group { display: flex; align-items: center; gap: 8px; }
  .sheet { position: absolute; inset: 76px auto 0 0; border-top-right-radius: 20px; width: 300px; background: var(--card); padding: 18px 14px; box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5); }
  .sheet .close { display: flex; justify-content: flex-end; color: var(--muted-foreground); font-size: 22px; margin-bottom: 18px; }
  .m-item { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 999px; color: var(--muted-foreground); font-size: 18px; font-weight: 500; }
  .m-item.active { background: var(--foreground); color: var(--background); }
  .m-item .ic { font-size: 22px; }
  .m-item .count { margin-left: 2px; min-width: 22px; height: 22px; border-radius: 999px; background: oklch(0.87 0.16 152 / 0.18); color: var(--brand-text); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

  /* B: soft background behind the icon */
  .b .tab .ic, .b .m-item .ic { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--muted); font-size: 16px; }
  .b .tab { padding-left: 6px; }
  .b .tab.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .m-item { padding-left: 8px; }
  .b .m-item .ic { width: 34px; height: 34px; font-size: 19px; }
  .b .m-item.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .round.labelled .ic { font-size: 18px; }

  /* C: icon above the label */
  .c .tab { flex-direction: column; justify-content: center; gap: 2px; height: 56px; padding: 0 14px; font-size: 13px; border-radius: 18px; }
  .c .nav { border-radius: 24px; }
  .c .tab .ic { font-size: 20px; }
  .c .round.stacked { flex-direction: column; gap: 2px; height: 68px; min-width: 64px; border-radius: 20px; font-size: 12px; padding: 0 8px; }
  .c .chip { border-radius: 24px; }
  .c .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .c .m-item { flex-direction: column; justify-content: center; gap: 6px; height: 84px; border-radius: 18px; background: var(--muted); font-size: 15px; padding: 0 8px; }
  .c .m-item.active { background: var(--foreground); }
  .c .m-item .ic { font-size: 24px; }

  /* Tooltip (components/ui/tooltip.tsx look) */
  .tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: var(--foreground); color: var(--background); font-size: 12px; line-height: 1.35; padding: 6px 12px; border-radius: 8px; opacity: 0; transform: translateY(2px) scale(0.97); transition: opacity 120ms, transform 120ms; }
  .tip.on { opacity: 1; transform: none; }
  .tip::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -4px; width: 10px; height: 10px; margin-left: -5px; background: var(--foreground); transform: rotate(45deg); border-radius: 2px; }
  .tip.below::after { bottom: auto; top: -4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted-foreground); font-size: 13px; margin-top: 10px; }
  .legend b { color: var(--foreground); font-weight: 600; }

  .term { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  /* Section 2b: suppliers list (fornecedores/index) and supplier page (fornecedores/$supplierId) */
  .wrap { padding: 8px 32px 32px; }
  .wrap h3 { margin: 0; font-size: 28px; font-weight: 600; }
  .wrap .lead { margin: 6px 0 0; color: var(--muted-foreground); font-size: 14px; }
  .scards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
  .scard { border-radius: 24px; background: var(--card); padding: 20px; font-size: 14px; }
  .shead { display: flex; gap: 12px; align-items: center; }
  .logo2 { width: 40px; height: 40px; border-radius: 12px; background: oklch(0.8 0.17 152 / 0.12); color: var(--brand-text); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .shead b { display: block; font-size: 16px; font-weight: 600; }
  .shead span { color: var(--muted-foreground); font-size: 13px; }
  .sdesc { color: var(--muted-foreground); margin: 14px 0; line-height: 1.45; min-height: 40px; }
  .thermo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .thermo i { height: 5px; border-radius: 9px; background: var(--muted); }
  .thermo i.on { background: oklch(0.85 0.2 125); }
  .thermo i.top { background: oklch(0.72 0.17 160); }
  .srow { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; }
  .lvl { color: oklch(0.85 0.2 125); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .lvl.top { color: oklch(0.75 0.16 160); }
  .lvl.new { color: var(--muted-foreground); font-weight: 400; }
  .lvl .num { color: var(--muted-foreground); font-weight: 400; }
  .stars { display: inline-flex; align-items: center; gap: 4px; }
  .stars .ic { color: #f59e0b; font-size: 14px; }
  .tag { background: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .count { color: var(--muted-foreground); display: inline-flex; gap: 6px; align-items: center; }
  .detail { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .panel { border-radius: 24px; background: var(--card); padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; font-size: 14px; }
  .panel .cap { color: var(--muted-foreground); font-size: 13px; }
  .panel .big { font-size: 36px; font-weight: 600; margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
  .panel .big small { color: oklch(0.85 0.2 125); font-size: 14px; font-weight: 600; }
  .panel .explain { color: var(--muted-foreground); font-size: 12px; margin-top: 4px; }
  .mrow { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
  .mrow .name { display: inline-flex; align-items: center; gap: 8px; }
  .mrow .name .ic { color: var(--muted-foreground); font-size: 15px; }
  .mrow .val { display: inline-flex; align-items: center; gap: 8px; }
  .mrow .val .ok { color: oklch(0.8 0.17 152); font-size: 15px; }
  .goal { color: var(--muted-foreground); font-size: 12px; }
  .vend { margin-top: 0; height: 38px; border-radius: 999px; background: oklch(0.8 0.17 152); color: oklch(0.18 0.02 160); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 500; font-size: 14px; }
  .pc { border-radius: 24px; background: var(--card); overflow: hidden; font-size: 13px; }
  .pc .ph2 { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--muted-foreground); background: oklch(0.5 0 0 / 0.08); }
  .pc .bd { padding: 14px 16px; }
  .pc .meta2 { color: var(--muted-foreground); font-size: 12px; }
  .pc .prices { display: flex; justify-content: space-between; margin-top: 10px; }
  .pc .prices small { display: block; color: var(--muted-foreground); font-size: 12px; }
  .pc .ft { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; color: var(--muted-foreground); font-size: 12px; }
  .pbtn { height: 30px; border-radius: 999px; background: var(--muted); color: var(--foreground); display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 13px; font-weight: 500; }
  .pfil { display: flex; gap: 10px; align-items: center; margin-top: 18px; font-size: 14px; }
  .pfil .search { flex: 1; height: 38px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted-foreground); }
  .pfil .chk2 { display: inline-flex; gap: 8px; align-items: center; }
  .pfil .chk2 i { width: 16px; height: 16px; border: 1px solid oklch(0.6 0 0 / 0.5); border-radius: 4px; display: inline-block; }
  .mob { padding: 14px; }
  .mob .scards { grid-template-columns: 1fr; }
  .mob .panel { grid-template-columns: 1fr; margin-top: 12px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1>Seção 2b · Catálogo: fornecedores (vendedor)</h1>
      <p>Lista de fornecedores e página de um fornecedor. Passe o mouse ou toque: nível do score, "Fornecedor destaque", "Novo fornecedor", métricas, "meta até", "Vender este fornecedor" e "Publicar".</p>
    </div>
    <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
  </div>
  <div id="root"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

  const thermo = `<div class="thermo">${[0, 1, 2, 3, 4].map((i) => `<i class="${i === s.bar ? (s.kind === "top" ? "top" : "on") : ""}"></i>`).join("")}</div>`;
  let label = "";
  if (s.kind === "top") label = `<span class="lvl top"${tipOf(key, HINT.top)}>${ic("Medal", "fill")}Fornecedor destaque${key === "b" ? ' <span class="num">· 96</span>' : ""}</span>`;
  if (s.kind === "good") label = `<span class="lvl"${tipOf(key, HINT.level)}>Bom${key === "b" ? ' <span class="num">· 85</span>' : ""}</span>`;
  if (s.kind === "new") label = `<span class="lvl new"${tipOf(key, HINT.fresh)}>Novo fornecedor</span>`;
  const stars = s.stars ? `<span class="stars">${ic("Star", "fill")}<b>${s.stars}</b> <span style="color:var(--muted-foreground)">(${s.reviews} avaliações)</span></span>` : '<span style="color:var(--muted-foreground)">Sem avaliações</span>';
  return `<div class="scard"><div class="shead"><span class="logo2">${s.initials}</span><div><b>${s.name}</b><span>${s.city}</span></div></div><div class="sdesc">${s.desc}</div>${thermo}<div class="srow">${label}${stars}</div><div class="srow"><span class="tag">${s.niche}</span><span class="count">${ic("Package")}${s.products} produtos</span></div></div>`;
}
const SUPPLIERS = [
  { initials: "AD", name: "Ateliê Divinópolis Confecções", city: "Divinópolis - MG", desc: "Confecção própria no polo de moda de Divinópolis.", bar: 3, kind: "good", stars: "4,5", reviews: 72, niche: "Moda feminina", products: 20 },
  { initials: "BD", name: "BH Beauty Distribuidora", city: "Belo Horizonte - MG", desc: "Cosméticos nacionais registrados na Anvisa.", bar: 4, kind: "top", stars: "5,0", reviews: 60, niche: "Cosméticos", products: 14 },
  { initials: "BT", name: "Blumenau Têxtil Casa", city: "Blumenau - SC", desc: "Cama, mesa e banho do Vale do Itajaí.", bar: -1, kind: "new", niche: "Casa e decoração", products: 18 },
];
const METRICS = [["Prazo de despacho", "93%", "Truck", "aspect"], ["Produto conforme o anúncio", "81%", "SealCheck", "aspect"], ["Embalagem", "95%", "Gift", "aspect"], ["Atendimento", "92%", "Headset", "aspect"], ["Taxa de devolução", "2,7%", "ArrowUUpLeft", "goal", "meta até 3%"], ["Taxa de cancelamento", "1,8%", "XCircle", "goal", "meta até 2,5%"]];
function panel(key) {
  const rows = METRICS.map(([name, value, icon, kind, goal]) => {
    const glyph = key === "c" ? ic(icon) : "";
    const nameHtml = kind === "aspect" && key !== "now" ? `<span class="term" data-tip="${HINT.aspect}" tabindex="0">${name}</span>` : name;
    const goalHtml = goal ? (key === "now" ? `<span class="goal">${goal}</span>` : `<span class="goal term" data-tip="${HINT.goal}" tabindex="0">${goal}</span>`) : "";
    return `<div class="mrow"><span class="name">${glyph}${nameHtml}</span><span class="val">${goalHtml}<b>${value}</b><span class="ok">${ICONS.CheckCircle.fill}</span></span></div>`;
  }).join("");
  const explain = key === "b" ? '<div class="explain">De 0 a 100, pelas avaliações de quem já vendeu os produtos deste fornecedor.</div>' : "";
  const level = key === "now" ? "<small>Bom</small>" : `<small class="term" data-tip="${HINT.level}" tabindex="0">Bom</small>`;
  return `<div class="panel"><div><div class="cap">Score do fornecedor · últimos 90 dias</div><div class="big">85 ${level}</div>${explain}<div class="thermo" style="margin-top:10px"><i></i><i></i><i></i><i class="on"></i><i></i></div><div style="margin-top:10px" class="stars">${ic("Star", "fill")}<b>4,5</b> <span style="color:var(--muted-foreground)">(72 avaliações)</span></div></div><div>${rows}</div></div>`;
}
function productCard(key) {
  const code = key === "now" ? "SKU S01-021" : "código S01-021";
  const btn = key === "now" ? `<span class="pbtn">Publicar</span>` : `<span class="pbtn"${tipOf(key, HINT.publish)}>${ic("PaperPlaneTilt")}Publicar</span>`;
  return `<div class="pc"><div class="ph2">${ICONS.TShirt.regular}</div><div class="bd"><div class="meta2">Moda feminina · ${code}</div><div>Blusa de tricô canelada - Branco</div><div class="prices"><span><small>Custo</small><b>R$ 34,85</b></span><span style="text-align:right"><small>Preço sugerido</small>R$ 79,90</span></div><div class="ft"><span>75 em estoque<br>atualizado ontem</span>${btn}</div></div></div>`;
}
function supplierPage(key) {
  const search = key === "now" ? "Buscar por nome ou SKU" : "Buscar por nome ou código";
  const stock = key === "now" ? "Somente com estoque" : "Só com estoque";
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:26px"><div><div style="color:var(--muted-foreground);font-size:13px;display:inline-flex;gap:6px;align-items:center">${ICONS.ArrowLeft.regular} Fornecedores</div><h3 style="margin-top:8px">Ateliê Divinópolis Confecções</h3><p class="lead">Moda feminina · Divinópolis - MG</p></div><span class="vend"${tipOf(key, HINT.sell)}>${ic("Storefront", "bold")}Vender este fornecedor</span></div>
    <div class="detail">${panel(key)}${productCard(key)}</div><div class="pfil"><div class="search">${ic("MagnifyingGlass")}${search}</div><span class="chk2"><i></i>${stock}</span></div>`;
}
function desktop(key) {
  return `<div class="wrap"><h3>Fornecedores</h3><p class="lead">Atacadistas de todo o Brasil, com o score dado por quem já vendeu os produtos deles.</p><div class="scards">${SUPPLIERS.map((s) => supplierCard(key, s)).join("")}</div>${supplierPage(key)}</div>`;
}
function mobile(key) {
  return `<div class="mob"><div class="scards">${supplierCard(key, SUPPLIERS[0])}</div>${panel(key)}</div>`;
}
function render() {
  document.getElementById("root").innerHTML = PROPOSALS.map((p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px (lista e página do fornecedor)</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`).join("");
  fit();
}
function fit() {
  document.querySelectorAll(".desktop-fit").forEach((box) => {
    const inner = box.firstElementChild;
    const scale = Math.min(1, box.clientWidth / 1440);
    inner.style.transform = `scale(${scale})`;
    box.style.height = `${inner.offsetHeight * scale}px`;
  });
}
// Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
const tip = document.getElementById("tip");
let timer = 0, current = null;
function show(el) {
  current = el;
  tip.textContent = el.dataset.tip;
  tip.classList.remove("below");
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
  let left = Math.max(frame.left + 8, Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2));
  let top = r.top - h - 10;
  if (top < 8) { top = r.bottom + 10; tip.classList.add("below"); }
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
  tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
  tip.classList.add("on");
}
function hide() { clearTimeout(timer); current = null; tip.classList.remove("on"); }
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el === current) return;
  hide();
  if (el) timer = setTimeout(() => show(el), 300);
});
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el && el !== current) { hide(); show(el); return; }
  hide();
});
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
document.addEventListener("focusout", hide);
window.addEventListener("scroll", hide, { passive: true });
window.addEventListener("resize", fit);
const themeButton = document.getElementById("theme");
themeButton.addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
});
render();
document.fonts.ready.then(fit);
</script>
</body>
</html>
