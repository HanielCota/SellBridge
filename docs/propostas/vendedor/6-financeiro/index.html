<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Propostas: financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.97 0.002 260);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted: oklch(0.945 0.003 260);
        --muted-foreground: oklch(0.47 0.008 260);
        --brand: oklch(0.78 0.18 155);
        --brand-text: oklch(0.5 0.13 152);
        --brand-mark: oklch(0.62 0.16 152);
        --primary-foreground: oklch(0.2 0.015 250);
        --popover: oklch(1 0 0);
        --border: oklch(0 0 0 / 0.08);
        --mark: #ff2d2d;
      }
      :root.dark {
        --background: oklch(0.165 0.003 260);
        --foreground: oklch(0.97 0 0);
        --card: oklch(0.215 0.004 260);
        --muted: oklch(0.27 0.004 260);
        --muted-foreground: oklch(0.72 0.005 260);
        --brand: oklch(0.87 0.16 152);
        --brand-text: oklch(0.87 0.16 152);
        --brand-mark: oklch(0.87 0.16 152);
        --primary-foreground: oklch(0.18 0.02 160);
        --popover: oklch(0.24 0.004 260);
        --border: oklch(1 0 0 / 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .page {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .topbar h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .topbar p {
        margin: 4px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .toggle {
        border: 0;
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
      .proposal {
        margin-top: 36px;
      }
      .proposal-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
      }
      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
        font-size: 18px;
      }
      .proposal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 4px 0 14px;
        max-width: 820px;
        line-height: 1.5;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .frames .mobile-col {
        max-width: 390px;
      }

      .frame {
        border-radius: 20px;
        outline: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }
      .frame-label {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px 4px;
        font-weight: 600;
      }
      .desktop-fit {
        overflow: hidden;
      }
      .desktop {
        width: 1440px;
        transform-origin: 0 0;
      }
      .mobile {
        width: 390px;
        position: relative;
        height: 560px;
      }

      /* Header reproduction (top-nav.tsx) */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
      }
      .hdr .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted-foreground);
        white-space: nowrap;
        cursor: pointer;
        text-decoration: none;
      }
      .tab:hover {
        color: var(--foreground);
      }
      .tab.active {
        background: var(--foreground);
        color: var(--background);
      }
      .tab .ic {
        font-size: 18px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }
      .round {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .round:hover {
        color: var(--foreground);
      }
      .round .ic {
        font-size: 20px;
      }
      .round.labelled {
        padding: 0 16px 0 14px;
      }
      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152);
        color: oklch(0.18 0.02 160);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip .name {
        line-height: 1.2;
        white-space: nowrap;
      }
      .chip .name b {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .chip .name span {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .caret {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .content {
        padding: 20px 32px 28px;
      }
      .content h3 {
        font-size: 56px;
        letter-spacing: -0.03em;
        margin: 0;
        font-weight: 600;
      }
      .content p {
        color: var(--muted-foreground);
        margin: 6px 0 0;
        font-size: 14px;
      }

      /* Mobile */
      .m-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      .m-hdr .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sheet {
        position: absolute;
        inset: 76px auto 0 0;
        border-top-right-radius: 20px;
        width: 300px;
        background: var(--card);
        padding: 18px 14px;
        box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5);
      }
      .sheet .close {
        display: flex;
        justify-content: flex-end;
        color: var(--muted-foreground);
        font-size: 22px;
        margin-bottom: 18px;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 18px;
        font-weight: 500;
      }
      .m-item.active {
        background: var(--foreground);
        color: var(--background);
      }
      .m-item .ic {
        font-size: 22px;
      }
      .m-item .count {
        margin-left: 2px;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152 / 0.18);
        color: var(--brand-text);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* B: soft background behind the icon */
      .b .tab .ic,
      .b .m-item .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        font-size: 16px;
      }
      .b .tab {
        padding-left: 6px;
      }
      .b .tab.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .m-item {
        padding-left: 8px;
      }
      .b .m-item .ic {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .b .m-item.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .round.labelled .ic {
        font-size: 18px;
      }

      /* C: icon above the label */
      .c .tab {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 56px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 18px;
      }
      .c .nav {
        border-radius: 24px;
      }
      .c .tab .ic {
        font-size: 20px;
      }
      .c .round.stacked {
        flex-direction: column;
        gap: 2px;
        height: 68px;
        min-width: 64px;
        border-radius: 20px;
        font-size: 12px;
        padding: 0 8px;
      }
      .c .chip {
        border-radius: 24px;
      }
      .c .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .c .m-item {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        height: 84px;
        border-radius: 18px;
        background: var(--muted);
        font-size: 15px;
        padding: 0 8px;
      }
      .c .m-item.active {
        background: var(--foreground);
      }
      .c .m-item .ic {
        font-size: 24px;
      }

      /* Tooltip (components/ui/tooltip.tsx look) */
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--foreground);
        color: var(--background);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(2px) scale(0.97);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        left: var(--arrow, 50%);
        bottom: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--foreground);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .tip.below::after {
        bottom: auto;
        top: -4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 10px;
      }
      .legend b {
        color: var(--foreground);
        font-weight: 600;
      }

      .term {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: help;
      }
      .wrap {
        padding: 8px 32px 32px;
        font-size: 14px;
        position: relative;
        min-height: 560px;
      }
      .sum {
        border-radius: 24px;
        background: var(--card);
        padding: 18px 22px;
        line-height: 1.8;
        color: var(--muted-foreground);
      }
      .sum b {
        color: var(--foreground);
      }
      .meta9 {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted-foreground);
        margin-bottom: 6px;
      }
      .info {
        display: inline-flex;
        vertical-align: -1px;
        margin-left: 3px;
        font-size: 13px;
        cursor: help;
      }
      .day {
        display: flex;
        justify-content: space-between;
        margin: 18px 6px 8px;
        font-size: 13px;
      }
      .list9 {
        border-radius: 22px;
        background: var(--card);
        padding: 0 18px;
      }
      .r9 {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .r9:last-child {
        border-bottom: 0;
      }
      .im {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .r9 .t {
        flex: 1;
      }
      .r9 .t p {
        margin: 2px 0 0;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .r9 .v {
        text-align: right;
      }
      .r9 .v p {
        margin: 2px 0 0;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .g {
        color: oklch(0.8 0.17 152);
        font-weight: 600;
      }
      .chev {
        color: var(--muted-foreground);
        display: inline-flex;
      }
      .stmt {
        position: absolute;
        right: 32px;
        top: 330px;
        width: 330px;
        border-radius: 18px;
        background: var(--popover);
        box-shadow: 0 16px 40px oklch(0 0 0 / 0.45);
        padding: 16px;
        font-size: 13px;
      }
      .stmt .kv {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }
      .mob {
        padding: 14px;
        font-size: 14px;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div>
          <h1>Seção 6 · Financeiro (vendedor)</h1>
          <p>
            Passe o mouse ou toque em "1 cancelado", "taxas", "vendas válidas", "fora da receita" e
            "Taxas" no detalhe do pedido.
          </p>
        </div>
        <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
      </div>
      <div id="root"></div>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>

          fill: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M247.59,61.22,195.83,33A8,8,0,0,0,192,32H160a8,8,0,0,0-8,8,24,24,0,0,1-48,0,8,8,0,0,0-8-8H64a8,8,0,0,0-3.84,1L8.41,61.22A15.76,15.76,0,0,0,1.82,82.48l19.27,36.81A16.37,16.37,0,0,0,35.67,128H56v80a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V128h20.34a16.37,16.37,0,0,0,14.58-8.71l19.27-36.81A15.76,15.76,0,0,0,247.59,61.22ZM35.67,112a.62.62,0,0,1-.41-.13L16.09,75.26,56,53.48V112Zm185.07-.14a.55.55,0,0,1-.41.14H200V53.48l39.92,21.78Z"></path></svg>',
          duotone:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M247.11,78.77l-19.27,36.81a8.44,8.44,0,0,1-7.5,4.42H192V40l51.78,28.25A7.81,7.81,0,0,1,247.11,78.77Zm-238.22,0,19.27,36.81a8.44,8.44,0,0,0,7.5,4.42H64V40L12.22,68.25A7.81,7.81,0,0,0,8.89,78.77Z" opacity="0.2"></path><path d="M247.59,61.22,195.83,33A8,8,0,0,0,192,32H160a8,8,0,0,0-8,8,24,24,0,0,1-48,0,8,8,0,0,0-8-8H64a8,8,0,0,0-3.84,1L8.41,61.22A15.76,15.76,0,0,0,1.82,82.48l19.27,36.81A16.37,16.37,0,0,0,35.67,128H56v80a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V128h20.34a16.37,16.37,0,0,0,14.58-8.71l19.27-36.81A15.76,15.76,0,0,0,247.59,61.22ZM35.67,112a.62.62,0,0,1-.41-.13L16.09,75.26,56,53.48V112ZM184,208H72V48h16.8a40,40,0,0,0,78.38,0H184Zm36.75-96.14a.55.55,0,0,1-.41.14H200V53.48l39.92,21.78Z"></path></svg>',
        },
      };
      const HINT = {
        cancelled:
          "Aguardando pagamento, cancelados e devolvidos não entram na receita nem no lucro",
        fees: "Taxas do marketplace e do SellBridge sobre as vendas",
        valid: "Pedidos pagos que contam na receita; os outros aparecem com R$ 0,00",
        outside: "Ainda não pago, cancelado ou devolvido: não conta na receita nem no lucro",
        stmtFees: "Média do que o Mercado Livre cobra por venda; muda conforme a categoria",
        row: "Ver o detalhe deste pedido: receita, custo, taxas e lucro",
      };
      const PROPOSALS = [
        {
          key: "now",
          letter: "–",
          title: "Como está hoje",
          note: 'Os ⓘ de "1 cancelado" e "taxas" já têm legenda, mas de um componente próprio desta tela (abre sem atraso e não abre por toque). "vendas válidas", "fora da receita" e "Taxas" no detalhe do pedido não têm explicação.',
        },
        {
          key: "a",
          letter: "A",
          title: "Só legendas, no padrão do site",
          note: 'Os ⓘ passam a usar a legenda única do site (300 ms, toque no celular). "vendas válidas", "fora da receita" e "Taxas" ganham sublinhado pontilhado e legenda. Nada muda de lugar.',
        },
        {
          key: "b",
          letter: "B",
          title: "Palavras mais claras (recomendada)",
          note: 'Como A, e "fora da receita" vira "não conta como venda", que diz o que acontece sem jargão. As linhas do extrato ganham uma setinha à direita, mostrando que abrem o detalhe do pedido.',
        },
        {
          key: "c",
          letter: "C",
          title: "Tudo com ⓘ",
          note: "Como A, mas todos os termos usam o ⓘ (como os dois que já existem) em vez do sublinhado pontilhado. Mais uniforme nesta tela, porém diferente do resto do site.",
        },
      ];
      const tipOf = (k, t) => (k === "now" ? "" : ` data-tip="${t}" tabindex="0"`);
      function term(k, text, h) {
        if (k === "now") return text;
        if (k === "c")
          return `${text}<span class="info" data-tip="${h}" tabindex="0">${ICONS.Info.regular}</span>`;
        return `<span class="term" data-tip="${h}" tabindex="0">${text}</span>`;
      }
      function info(k, h) {
        return `<span class="info"${k === "now" ? ` data-tip="${h}"` : ` data-tip="${h}" tabindex="0"`}>${ICONS.Info.regular}</span>`;
      }
      function row(k, name, line, value, sub, zero) {
        const subText = zero
          ? k === "b"
            ? "não conta como venda"
            : term(k, "fora da receita", HINT.outside)
          : sub;
        const subHtml =
          zero && k === "b"
            ? `<span class="term" data-tip="${HINT.outside}" tabindex="0">${subText}</span>`
            : subText;
        const chev = k === "b" ? `<span class="chev">${ICONS.CaretRight.regular}</span>` : "";
        return `<div class="r9"${k === "b" ? ` data-tip="${HINT.row}"` : ""}><span class="im">${ICONS.TShirt.regular}</span><div class="t">${name}<p>${line}</p></div><div class="v"><span class="${zero ? "" : "g"}">${value}</span><p>${subHtml}</p></div>${chev}</div>`;
      }
      function body(k, mobile) {
        const sum = `<div class="sum"><div class="meta9"><span>93 pedidos · 1 cancelado${info(k, HINT.cancelled)}</span>${mobile ? "" : "<span>Clique num dia do gráfico para ver só ele</span>"}</div>Você vendeu <b>R$ 8.654,50</b>. Desse valor, <b>R$ 4.083,33</b> pagaram os produtos e <b>R$ 1.228,26</b> foram taxas${info(k, HINT.fees)}, e <b>R$ 78,15</b> voltaram em reembolsos.</div>`;
        const day = `<div class="day"><b>Sexta-feira, 16 de out.</b><span>${term(k, "5 vendas válidas", HINT.valid)} · <b>+R$ 177,61</b></span></div>`;
        const list = `<div class="list9">${row(k, "Vaso de cerâmica artesanal 20 cm", "23:26 · Ana Casa &amp; Beleza", "+R$ 39,31", "de R$ 89,90", false)}${row(k, "Máscara capilar nutrição 300 g", "16:02 · Ana Casa &amp; Beleza · Aguardando pagamento", "R$ 0,00", "", true)}</div>`;
        const stmt = mobile
          ? ""
          : `<div class="stmt"><div style="display:flex;justify-content:space-between"><b>CT-SIM-0028</b><span style="color:oklch(0.7 0.15 240)">• Pago</span></div><div class="kv" style="margin-top:8px"><span>Receita</span><b>R$ 52,90</b></div><div class="kv"><span>Produtos</span><span>-R$ 21,50</span></div><div class="kv"><span>${k === "now" ? "Taxas" : `<span class="term" data-tip="${HINT.stmtFees}" tabindex="0">Taxas</span>`}</span><span>-R$ 7,41</span></div><div class="kv"><b>Lucro</b><b>R$ 23,99</b></div></div>`;
        return sum + day + list + stmt;
      }
      function desktop(k) {
        return `<div class="wrap">${body(k, false)}</div>`;
      }
      function mobile(k) {
        return `<div class="mob">${body(k, true)}</div>`;
      }
      function render() {
        document.getElementById("root").innerHTML = PROPOSALS.map(
          (p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px (resumo, extrato e detalhe de um pedido)</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`,
        ).join("");
        fit();
      }
      function fit() {
        document.querySelectorAll(".desktop-fit").forEach((box) => {
          const inner = box.firstElementChild;
          const scale = Math.min(1, box.clientWidth / 1440);
          inner.style.transform = `scale(${scale})`;
          box.style.height = `${inner.offsetHeight * scale}px`;
        });
      }
      // Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
      const tip = document.getElementById("tip");
      let timer = 0,
        current = null;
      function show(el) {
        current = el;
        tip.textContent = el.dataset.tip;
        tip.classList.remove("below");
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth,
          h = tip.offsetHeight;
        const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
        let left = Math.max(
          frame.left + 8,
          Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2),
        );
        let top = r.top - h - 10;
        if (top < 8) {
          top = r.bottom + 10;
          tip.classList.add("below");
        }
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
        tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
        tip.classList.add("on");
      }
      function hide() {
        clearTimeout(timer);
        current = null;
        tip.classList.remove("on");
      }
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el === current) return;
        hide();
        if (el) timer = setTimeout(() => show(el), 300);
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && el !== current) {
          hide();
          show(el);
          return;
        }
        hide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest("[data-tip]");
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, { passive: true });
      window.addEventListener("resize", fit);
      const themeButton = document.getElementById("theme");
      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.classList.toggle("dark");
        themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
      });
      render();
      document.fonts.ready.then(fit);
    </script>
  </body>
