<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Propostas: sublinhado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.97 0.002 260);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted: oklch(0.945 0.003 260);
        --muted-foreground: oklch(0.47 0.008 260);
        --brand: oklch(0.78 0.18 155);
        --brand-text: oklch(0.5 0.13 152);
        --brand-mark: oklch(0.62 0.16 152);
        --primary-foreground: oklch(0.2 0.015 250);
        --popover: oklch(1 0 0);
        --border: oklch(0 0 0 / 0.08);
        --mark: #ff2d2d;
      }
      :root.dark {
        --background: oklch(0.165 0.003 260);
        --foreground: oklch(0.97 0 0);
        --card: oklch(0.215 0.004 260);
        --muted: oklch(0.27 0.004 260);
        --muted-foreground: oklch(0.72 0.005 260);
        --brand: oklch(0.87 0.16 152);
        --brand-text: oklch(0.87 0.16 152);
        --brand-mark: oklch(0.87 0.16 152);
        --primary-foreground: oklch(0.18 0.02 160);
        --popover: oklch(0.24 0.004 260);
        --border: oklch(1 0 0 / 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .page {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .topbar h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .topbar p {
        margin: 4px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .toggle {
        border: 0;
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
      .proposal {
        margin-top: 36px;
      }
      .proposal-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
      }
      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
        font-size: 18px;
      }
      .proposal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 4px 0 14px;
        max-width: 820px;
        line-height: 1.5;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .frames .mobile-col {
        max-width: 390px;
      }

      .frame {
        border-radius: 20px;
        outline: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }
      .frame-label {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px 4px;
        font-weight: 600;
      }
      .desktop-fit {
        overflow: hidden;
      }
      .desktop {
        width: 1440px;
        transform-origin: 0 0;
      }
      .mobile {
        width: 390px;
        position: relative;
        height: 560px;
      }

      /* Header reproduction (top-nav.tsx) */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
      }
      .hdr .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted-foreground);
        white-space: nowrap;
        cursor: pointer;
        text-decoration: none;
      }
      .tab:hover {
        color: var(--foreground);
      }
      .tab.active {
        background: var(--foreground);
        color: var(--background);
      }
      .tab .ic {
        font-size: 18px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }
      .round {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .round:hover {
        color: var(--foreground);
      }
      .round .ic {
        font-size: 20px;
      }
      .round.labelled {
        padding: 0 16px 0 14px;
      }
      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152);
        color: oklch(0.18 0.02 160);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip .name {
        line-height: 1.2;
        white-space: nowrap;
      }
      .chip .name b {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .chip .name span {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .caret {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .content {
        padding: 20px 32px 28px;
      }
      .content h3 {
        font-size: 56px;
        letter-spacing: -0.03em;
        margin: 0;
        font-weight: 600;
      }
      .content p {
        color: var(--muted-foreground);
        margin: 6px 0 0;
        font-size: 14px;
      }

      /* Mobile */
      .m-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      .m-hdr .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sheet {
        position: absolute;
        inset: 76px auto 0 0;
        border-top-right-radius: 20px;
        width: 300px;
        background: var(--card);
        padding: 18px 14px;
        box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5);
      }
      .sheet .close {
        display: flex;
        justify-content: flex-end;
        color: var(--muted-foreground);
        font-size: 22px;
        margin-bottom: 18px;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 18px;
        font-weight: 500;
      }
      .m-item.active {
        background: var(--foreground);
        color: var(--background);
      }
      .m-item .ic {
        font-size: 22px;
      }
      .m-item .count {
        margin-left: 2px;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152 / 0.18);
        color: var(--brand-text);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* B: soft background behind the icon */
      .b .tab .ic,
      .b .m-item .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        font-size: 16px;
      }
      .b .tab {
        padding-left: 6px;
      }
      .b .tab.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .m-item {
        padding-left: 8px;
      }
      .b .m-item .ic {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .b .m-item.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .round.labelled .ic {
        font-size: 18px;
      }

      /* C: icon above the label */
      .c .tab {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 56px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 18px;
      }
      .c .nav {
        border-radius: 24px;
      }
      .c .tab .ic {
        font-size: 20px;
      }
      .c .round.stacked {
        flex-direction: column;
        gap: 2px;
        height: 68px;
        min-width: 64px;
        border-radius: 20px;
        font-size: 12px;
        padding: 0 8px;
      }
      .c .chip {
        border-radius: 24px;
      }
      .c .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .c .m-item {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        height: 84px;
        border-radius: 18px;
        background: var(--muted);
        font-size: 15px;
        padding: 0 8px;
      }
      .c .m-item.active {
        background: var(--foreground);
      }
      .c .m-item .ic {
        font-size: 24px;
      }

      /* Tooltip (components/ui/tooltip.tsx look) */
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--foreground);
        color: var(--background);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(2px) scale(0.97);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        left: var(--arrow, 50%);
        bottom: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--foreground);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .tip.below::after {
        bottom: auto;
        top: -4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 10px;
      }
      .legend b {
        color: var(--foreground);
        font-weight: 600;
      }

      .wrap {
        padding: 8px 32px 32px;
        font-size: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .card8 {
        border-radius: 24px;
        background: var(--card);
        padding: 18px;
      }
      .kpi {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .kpi div {
        background: var(--background);
        border-radius: 16px;
        padding: 12px;
      }
      .kpi b {
        display: block;
        font-size: 22px;
        margin-top: 4px;
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .t {
        cursor: help;
      }
      .now .t {
        text-decoration: underline dotted;
        text-underline-offset: 4px;
      }
      .a .t {
        text-decoration: underline solid;
        text-decoration-thickness: 1px;
        text-decoration-color: color-mix(in oklch, currentColor 28%, transparent);
        text-underline-offset: 4px;
      }
      .a .t:hover,
      .a .t:focus-visible {
        text-decoration-color: currentColor;
      }
      .b .t {
        border-radius: 4px;
        transition: color 120ms;
      }
      .b .t:hover,
      .b .t:focus-visible {
        color: var(--foreground);
        background: color-mix(in oklch, var(--foreground) 8%, transparent);
      }
      .c .t {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .c .t .ic {
        display: inline-flex;
        opacity: 0.55;
      }
      .c .t .ic svg {
        width: 13px;
        height: 13px;
      }
      .row8 {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .mob {
        padding: 14px;
        font-size: 14px;
      }
      .mob .wrap {
        display: block;
        padding: 0;
      }
      .mob .card8 + .card8 {
        margin-top: 12px;
      }
      .mob .kpi {
        grid-template-columns: 1fr 1fr;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div>
          <h1>Revisão · Marca de termo com legenda</h1>
          <p>
            O mesmo estilo vale nas 17 telas onde hoje há o sublinhado pontilhado (Visão geral,
            Lojas, Financeiro, Publicações, painel do fornecedor). Passe o mouse ou toque nos
            termos.
          </p>
        </div>
        <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
      </div>
      <div id="root"></div>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>
    <script>
      const ICONS = {
        Info: {
          regular:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"></path></svg>',
          bold: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M108,84a16,16,0,1,1,16,16A16,16,0,0,1,108,84Zm128,44A108,108,0,1,1,128,20,108.12,108.12,0,0,1,236,128Zm-24,0a84,84,0,1,0-84,84A84.09,84.09,0,0,0,212,128Zm-72,36.68V132a20,20,0,0,0-20-20,12,12,0,0,0-4,23.32V168a20,20,0,0,0,20,20,12,12,0,0,0,4-23.32Z"></path></svg>',
          fill: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm-4,48a12,12,0,1,1-12,12A12,12,0,0,1,124,72Zm12,112a16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40a8,8,0,0,1,0,16Z"></path></svg>',
          duotone:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"></path><path d="M144,176a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176Zm88-48A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128ZM124,96a12,12,0,1,0-12-12A12,12,0,0,0,124,96Z"></path></svg>',
        },
      };
      const HINT = {
        ticket: "Valor médio de cada pedido no período (receita ÷ pedidos)",
        units: "Quantidade de itens vendidos",
        fee: "O que o Mercado Livre cobra por venda (média; muda com a categoria)",
        health: "Só você vê: a cor sai dos prazos, cancelamentos e notas dos seus pedidos",
        accept: "Pedidos aceitos antes do prazo; a meta é 95% ou mais",
      };
      const PROPOSALS = [
        {
          key: "now",
          letter: "–",
          title: "Como está hoje",
          note: "Sublinhado pontilhado em todo termo com legenda. Fica forte e repetido quando há vários termos juntos (KPIs, métricas).",
        },
        {
          key: "a",
          letter: "A",
          title: "Linha fina e apagada (recomendada)",
          note: "Um sublinhado contínuo, fino e quase transparente, que acende ao passar o mouse. Continua mostrando que o termo tem legenda, inclusive no celular, sem pesar.",
        },
        {
          key: "b",
          letter: "B",
          title: "Sem marca",
          note: "O termo fica como texto normal; só ao passar o mouse ganha um fundo leve e o cursor de ajuda. Mais limpo, mas no celular nada indica que dá para tocar.",
        },
        {
          key: "c",
          letter: "C",
          title: "Ícone de informação",
          note: 'Um "i" pequeno e apagado depois do termo, sem sublinhado. Bem claro, mas soma um ícone por termo (na Visão geral seriam 4 de uma vez).',
        },
      ];
      const term = (k, text, hint) =>
        `<span class="t" data-tip="${hint}" tabindex="0">${text}${k === "c" ? `<span class="ic">${ICONS.Info.regular}</span>` : ""}</span>`;
      function cards(k) {
        return `<div class="card8"><b>Vendas no período</b><div class="kpi" style="margin-top:10px"><div><span class="muted">Receita</span><b>R$ 12.480</b></div><div><span class="muted">${term(k, "Ticket médio", HINT.ticket)}</span><b>R$ 72,56</b></div><div><span class="muted">${term(k, "Unidades", HINT.units)}</span><b>214</b></div></div>
    <div class="row8" style="margin-top:8px"><span class="muted">${term(k, "Taxa do marketplace", HINT.fee)}</span><span>− R$ 14,20</span></div></div>
    <div class="card8"><span class="muted">${term(k, "Saúde da conta em 60 dias", HINT.health)}</span><div style="font-size:26px;font-weight:600;margin:4px 0 12px">Vermelho</div><div class="row8"><b>${term(k, "Aceite no prazo", HINT.accept)}</b><span>85,2%</span></div></div>`;
      }
      function desktop(k) {
        return `<div class="wrap ${k}">${cards(k)}</div>`;
      }
      function mobile(k) {
        return `<div class="mob"><div class="wrap ${k}">${cards(k)}</div></div>`;
      }
      function render() {
        document.getElementById("root").innerHTML = PROPOSALS.map(
          (p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`,
        ).join("");
        fit();
      }
      function fit() {
        document.querySelectorAll(".desktop-fit").forEach((box) => {
          const inner = box.firstElementChild;
          const scale = Math.min(1, box.clientWidth / 1440);
          inner.style.transform = `scale(${scale})`;
          box.style.height = `${inner.offsetHeight * scale}px`;
        });
      }
      // Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
      const tip = document.getElementById("tip");
      let timer = 0,
        current = null;
      function show(el) {
        current = el;
        tip.textContent = el.dataset.tip;
        tip.classList.remove("below");
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth,
          h = tip.offsetHeight;
        const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
        let left = Math.max(
          frame.left + 8,
          Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2),
        );
        let top = r.top - h - 10;
        if (top < 8) {
          top = r.bottom + 10;
          tip.classList.add("below");
        }
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
        tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
        tip.classList.add("on");
      }
      function hide() {
        clearTimeout(timer);
        current = null;
        tip.classList.remove("on");
      }
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el === current) return;
        hide();
        if (el) timer = setTimeout(() => show(el), 300);
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && el !== current) {
          hide();
          show(el);
          return;
        }
        hide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest("[data-tip]");
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, { passive: true });
      window.addEventListener("resize", fit);
      const themeButton = document.getElementById("theme");
      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.classList.toggle("dark");
        themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
      });
      render();
      document.fonts.ready.then(fit);
    </script>
  </body>
</html>
