<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Propostas: fornecedor pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(0.97 0.002 260);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted: oklch(0.945 0.003 260);
        --muted-foreground: oklch(0.47 0.008 260);
        --brand: oklch(0.78 0.18 155);
        --brand-text: oklch(0.5 0.13 152);
        --brand-mark: oklch(0.62 0.16 152);
        --primary-foreground: oklch(0.2 0.015 250);
        --popover: oklch(1 0 0);
        --border: oklch(0 0 0 / 0.08);
        --mark: #ff2d2d;
      }
      :root.dark {
        --background: oklch(0.165 0.003 260);
        --foreground: oklch(0.97 0 0);
        --card: oklch(0.215 0.004 260);
        --muted: oklch(0.27 0.004 260);
        --muted-foreground: oklch(0.72 0.005 260);
        --brand: oklch(0.87 0.16 152);
        --brand-text: oklch(0.87 0.16 152);
        --brand-mark: oklch(0.87 0.16 152);
        --primary-foreground: oklch(0.18 0.02 160);
        --popover: oklch(0.24 0.004 260);
        --border: oklch(1 0 0 / 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .page {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 24px 80px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .topbar h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .topbar p {
        margin: 4px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
      }
      .toggle {
        border: 0;
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
      .proposal {
        margin-top: 36px;
      }
      .proposal-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
      }
      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
        font-size: 18px;
      }
      .proposal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 14px;
        margin: 4px 0 14px;
        max-width: 820px;
        line-height: 1.5;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .frames .mobile-col {
        max-width: 390px;
      }

      .frame {
        border-radius: 20px;
        outline: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }
      .frame-label {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0 0 6px 4px;
        font-weight: 600;
      }
      .desktop-fit {
        overflow: hidden;
      }
      .desktop {
        width: 1440px;
        transform-origin: 0 0;
      }
      .mobile {
        width: 390px;
        position: relative;
        height: 560px;
      }

      /* Header reproduction (top-nav.tsx) */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
      }
      .hdr .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
      }
      .nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted-foreground);
        white-space: nowrap;
        cursor: pointer;
        text-decoration: none;
      }
      .tab:hover {
        color: var(--foreground);
      }
      .tab.active {
        background: var(--foreground);
        color: var(--background);
      }
      .tab .ic {
        font-size: 18px;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }
      .round {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        background: var(--card);
        color: var(--muted-foreground);
        font-size: 14px;
        font-weight: 500;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .round:hover {
        color: var(--foreground);
      }
      .round .ic {
        font-size: 20px;
      }
      .round.labelled {
        padding: 0 16px 0 14px;
      }
      .badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--brand);
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        background: var(--card);
        padding: 6px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152);
        color: oklch(0.18 0.02 160);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chip .name {
        line-height: 1.2;
        white-space: nowrap;
      }
      .chip .name b {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .chip .name span {
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .caret {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 18px;
      }
      .content {
        padding: 20px 32px 28px;
      }
      .content h3 {
        font-size: 56px;
        letter-spacing: -0.03em;
        margin: 0;
        font-weight: 600;
      }
      .content p {
        color: var(--muted-foreground);
        margin: 6px 0 0;
        font-size: 14px;
      }

      /* Mobile */
      .m-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      .m-hdr .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sheet {
        position: absolute;
        inset: 76px auto 0 0;
        border-top-right-radius: 20px;
        width: 300px;
        background: var(--card);
        padding: 18px 14px;
        box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5);
      }
      .sheet .close {
        display: flex;
        justify-content: flex-end;
        color: var(--muted-foreground);
        font-size: 22px;
        margin-bottom: 18px;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 999px;
        color: var(--muted-foreground);
        font-size: 18px;
        font-weight: 500;
      }
      .m-item.active {
        background: var(--foreground);
        color: var(--background);
      }
      .m-item .ic {
        font-size: 22px;
      }
      .m-item .count {
        margin-left: 2px;
        min-width: 22px;
        height: 22px;
        border-radius: 999px;
        background: oklch(0.87 0.16 152 / 0.18);
        color: var(--brand-text);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* B: soft background behind the icon */
      .b .tab .ic,
      .b .m-item .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        font-size: 16px;
      }
      .b .tab {
        padding-left: 6px;
      }
      .b .tab.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .m-item {
        padding-left: 8px;
      }
      .b .m-item .ic {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }
      .b .m-item.active .ic {
        background: oklch(0.5 0 0 / 0.18);
      }
      .b .round.labelled .ic {
        font-size: 18px;
      }

      /* C: icon above the label */
      .c .tab {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 56px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 18px;
      }
      .c .nav {
        border-radius: 24px;
      }
      .c .tab .ic {
        font-size: 20px;
      }
      .c .round.stacked {
        flex-direction: column;
        gap: 2px;
        height: 68px;
        min-width: 64px;
        border-radius: 20px;
        font-size: 12px;
        padding: 0 8px;
      }
      .c .chip {
        border-radius: 24px;
      }
      .c .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .c .m-item {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        height: 84px;
        border-radius: 18px;
        background: var(--muted);
        font-size: 15px;
        padding: 0 8px;
      }
      .c .m-item.active {
        background: var(--foreground);
      }
      .c .m-item .ic {
        font-size: 24px;
      }

      /* Tooltip (components/ui/tooltip.tsx look) */
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--foreground);
        color: var(--background);
        font-size: 12px;
        line-height: 1.35;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(2px) scale(0.97);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip::after {
        content: "";
        position: absolute;
        left: var(--arrow, 50%);
        bottom: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--foreground);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .tip.below::after {
        bottom: auto;
        top: -4px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 10px;
      }
      .legend b {
        color: var(--foreground);
        font-weight: 600;
      }

      .term {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: help;
      }
      .wrap {
        padding: 8px 32px 32px;
        font-size: 14px;
      }
      .tabs3 {
        display: inline-flex;
        gap: 2px;
        background: var(--card);
        border-radius: 999px;
        padding: 4px;
      }
      .tabs3 span {
        padding: 7px 13px;
        border-radius: 999px;
        color: var(--muted-foreground);
      }
      .tabs3 span.on {
        background: var(--foreground);
        color: var(--background);
      }
      .srch3 {
        height: 40px;
        width: 380px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        color: var(--muted-foreground);
        margin-top: 14px;
      }
      .tbl3 {
        margin-top: 14px;
        border-radius: 24px;
        background: var(--card);
        padding: 0 20px;
      }
      .r3 {
        display: grid;
        grid-template-columns: 30px 1fr 1fr 120px;
        gap: 14px;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      .r3:last-child {
        border-bottom: 0;
      }
      .r3 p {
        margin: 2px 0 0;
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .bx {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid oklch(0.6 0 0 / 0.5);
      }
      .st3 {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .st3 i {
        width: 7px;
        height: 7px;
        border-radius: 9px;
        display: inline-block;
        margin-right: 6px;
      }
      .pill3 {
        border-radius: 999px;
        padding: 3px 10px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      .pill3.red {
        background: oklch(0.6 0.2 25 / 0.85);
        color: #fff;
      }
      .pill3.amber {
        background: oklch(0.8 0.15 85 / 0.18);
        color: oklch(0.85 0.15 90);
      }
      .pill3 .ic {
        display: inline-flex;
      }
      .warn3 {
        margin-top: 8px;
        font-size: 13px;
      }
      .warn3 p {
        margin: 0;
        font-size: 12px;
      }
      .act3 {
        justify-self: end;
        height: 36px;
        border-radius: 999px;
        background: oklch(0.8 0.17 152);
        color: oklch(0.18 0.02 160);
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
      }
      .dlg {
        margin-top: 20px;
        border-radius: 22px;
        background: var(--card);
        padding: 18px;
        max-width: 820px;
      }
      .btns3 {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .b3 {
        height: 36px;
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .b3.p {
        background: oklch(0.8 0.17 152);
        color: oklch(0.18 0.02 160);
        border-color: transparent;
      }
      .b3.d {
        background: oklch(0.6 0.2 25 / 0.18);
        color: oklch(0.72 0.18 25);
        border-color: transparent;
      }
      .b3 .ic {
        display: inline-flex;
      }
      .mob {
        padding: 14px;
        font-size: 14px;
      }
      .mob .r3 {
        grid-template-columns: 1fr;
      }
      .mob .srch3 {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div>
          <h1>Fornecedor · 2. Pedidos</h1>
          <p>
            Lista de pedidos e a janela de um pedido. Passe o mouse ou toque em "Com problema", nos
            prazos, em "Prazo vencido", em "Separar" e nos botões da janela.
          </p>
        </div>
        <button class="toggle" id="theme" type="button">Mudar para o modo claro</button>
      </div>
      <div id="root"></div>
    </div>
    <div class="tip" id="tip" role="tooltip"></div>
    <script>

            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>',
          bold: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"></path></svg>',
          fill: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72A8,8,0,0,1,136,200V136H40a8,8,0,0,1,0-16h96V56a8,8,0,0,1,13.66-5.66l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>',
          duotone:
            '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,128l-72,72V56Z" opacity="0.2"></path><path d="M221.66,122.34l-72-72A8,8,0,0,0,136,56v64H40a8,8,0,0,0,0,16h96v64a8,8,0,0,0,13.66,5.66l72-72A8,8,0,0,0,221.66,122.34ZM152,180.69V75.31L204.69,128Z"></path></svg>',
        },
      };
      const HINT = {
        problem: "Pedidos com ocorrência registrada ou prazo vencido",
        late: "O prazo de despacho já passou; despache ou registre uma ocorrência",
        soon: "Tempo que falta para despachar sem atrasar",
        expired: "Passou do prazo: isso pesa no seu desempenho",
        separate: "Marcar que você começou a separar o pedido",
        select: "Marque para aceitar vários pedidos de uma vez",
        label: "Imprime a etiqueta que identifica o volume do pedido",
        order: "Imprime a lista do que você deve separar e enviar",
        step: "Marca que você começou a separar o pedido",
        occurrence: "Anota um problema ou observação no histórico do envio",
        cancel: "Devolve o pedido ao revendedor; não dá para desfazer",
      };
      const PROPOSALS = [
        {
          key: "now",
          letter: "–",
          title: "Como está hoje",
          note: 'O atraso usa um "!" e o prazo a vencer usa um relógio; no lado do revendedor, atraso já usa o relógio de contagem. Busca fala em "SKU". Os botões da janela não têm ícone nem legenda, e o verde "Em separação" parece um aviso.',
        },
        {
          key: "a",
          letter: "A",
          title: "Mesmo padrão do revendedor (recomendada)",
          note: 'Atraso passa a usar o relógio de contagem (o mesmo do revendedor), "SKU" vira "código", legendas em "Com problema", prazos, "Prazo vencido", "Separar" e na caixinha. Na janela, o mesmo tratamento da 4b: "Marcar como em separação", ícones discretos e legendas no ponto de vista do fornecedor.',
        },
        {
          key: "b",
          letter: "B",
          title: "Só legendas",
          note: 'Legendas e "código" na busca, mas os ícones dos prazos e os textos dos botões ficam como estão.',
        },
        {
          key: "c",
          letter: "C",
          title: "Ação com seta",
          note: 'Como A, e o botão de cada linha ganha uma seta ("Separar →"), como "Operar pedido" no revendedor.',
        },
      ];
      const ic = (n, w = "regular") => `<span class="ic">${ICONS[n][w]}</span>`;
      const tipOf = (k, t) => (k === "now" ? "" : ` data-tip="${t}" tabindex="0"`);
      const lateIcon = (k) =>
        k === "a" || k === "c" ? ic("ClockCountdown", "bold") : ic("WarningCircle");
      function row(k) {
        const expired =
          k === "now"
            ? "Prazo vencido"
            : `<span class="term" data-tip="${HINT.expired}" tabindex="0">Prazo vencido</span>`;
        const act = `<span class="act3"${tipOf(k, HINT.separate)}>Separar${k === "c" ? ic("ArrowRight") : ""}</span>`;
        return `<div class="r3"><span class="bx"${tipOf(k, HINT.select)}></span><div><b>Pedido CT-SIM-0026</b><p>2× Cachepô de cerâmica pequeno com prato (CT-CACHEPO-P)</p></div><div><div class="st3"><span><i style="background:oklch(0.7 0.15 240)"></i>Aceito</span><span class="pill3 red"${tipOf(k, HINT.late)}>${lateIcon(k)}Despacho atrasado há 19 h</span></div><div class="warn3"><span style="color:oklch(0.7 0.19 25)">•</span> ${expired}<p style="color:var(--muted-foreground)">Avance a etapa ou registre uma ocorrência.</p></div></div>${act}</div>
    <div class="r3"><span></span><div><b>Pedido CT-SIM-0027</b><p>1× Vaso de cerâmica artesanal 20 cm</p></div><div class="st3"><span><i style="background:oklch(0.7 0.15 240)"></i>Aceito</span><span class="pill3 amber"${tipOf(k, HINT.soon)}>${ic("Clock")}Despacho em 5 h 48 min</span></div><span class="act3">Separar${k === "c" ? ic("ArrowRight") : ""}</span></div>`;
      }
      function dialog(k) {
        const g = k === "a" || k === "c";
        const b = (label, hint, icon, cls = "") =>
          `<span class="b3 ${cls}"${k === "b" || g ? ` data-tip="${hint}" tabindex="0"` : ""}>${g ? ic(icon) : ""}${label}</span>`;
        return `<div class="dlg"><b>Pedido CT-SIM-0026</b><div class="btns3">${b("Imprimir etiqueta de identificação", HINT.label, "Tag")}${b("Imprimir ordem de fornecimento", HINT.order, "Printer")}</div><div class="btns3">${b(g ? "Marcar como em separação" : "Em separação", HINT.step, "Check", "p")}${b("Registrar ocorrência", HINT.occurrence, "WarningCircle")}${b("Cancelar envio", HINT.cancel, "XCircle", "d")}</div></div>`;
      }
      function head(k) {
        const problem =
          k === "now"
            ? "Com problema 3"
            : `<span data-tip="${HINT.problem}" tabindex="0">Com problema 3</span>`;
        const ph = k === "now" ? "Número do pedido ou SKU" : "Número do pedido ou código";
        return `<div class="tabs3"><span class="on">A fazer 4</span><span>Aceitar 1</span><span>Separar 3</span><span>Despachar 0</span>${problem}<span>Enviados 2</span></div><div class="srch3">${ic("MagnifyingGlass")}${ph}</div>`;
      }
      function desktop(k) {
        return `<div class="wrap">${head(k)}<div class="tbl3">${row(k)}</div>${dialog(k)}</div>`;
      }
      function mobile(k) {
        return `<div class="mob"><div class="tbl3">${row(k)}</div>${dialog(k)}</div>`;
      }
      function render() {
        document.getElementById("root").innerHTML = PROPOSALS.map(
          (p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px (lista e janela do pedido)</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`,
        ).join("");
        fit();
      }
      function fit() {
        document.querySelectorAll(".desktop-fit").forEach((box) => {
          const inner = box.firstElementChild;
          const scale = Math.min(1, box.clientWidth / 1440);
          inner.style.transform = `scale(${scale})`;
          box.style.height = `${inner.offsetHeight * scale}px`;
        });
      }
      // Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
      const tip = document.getElementById("tip");
      let timer = 0,
        current = null;
      function show(el) {
        current = el;
        tip.textContent = el.dataset.tip;
        tip.classList.remove("below");
        const r = el.getBoundingClientRect();
        const w = tip.offsetWidth,
          h = tip.offsetHeight;
        const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
        let left = Math.max(
          frame.left + 8,
          Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2),
        );
        let top = r.top - h - 10;
        if (top < 8) {
          top = r.bottom + 10;
          tip.classList.add("below");
        }
        tip.style.left = `${left}px`;
        tip.style.top = `${top}px`;
        tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
        tip.classList.add("on");
      }
      function hide() {
        clearTimeout(timer);
        current = null;
        tip.classList.remove("on");
      }
      document.addEventListener("pointerover", (e) => {
        if (e.pointerType === "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el === current) return;
        hide();
        if (el) timer = setTimeout(() => show(el), 300);
      });
      document.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "touch") return;
        const el = e.target.closest("[data-tip]");
        if (el && el !== current) {
          hide();
          show(el);
          return;
        }
        hide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest("[data-tip]");
        if (el) show(el);
      });
      document.addEventListener("focusout", hide);
      window.addEventListener("scroll", hide, { passive: true });
      window.addEventListener("resize", fit);
      const themeButton = document.getElementById("theme");
      themeButton.addEventListener("click", () => {
        const dark = document.documentElement.classList.toggle("dark");
        themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
      });
      render();
      document.fonts.ready.then(fit);
    </script>
  </body>
</html>
