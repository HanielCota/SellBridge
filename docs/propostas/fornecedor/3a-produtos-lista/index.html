<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Propostas: produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --background: oklch(0.97 0.002 260); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.945 0.003 260); --muted-foreground: oklch(0.47 0.008 260); --brand: oklch(0.78 0.18 155);
    --brand-text: oklch(0.5 0.13 152); --brand-mark: oklch(0.62 0.16 152); --primary-foreground: oklch(0.2 0.015 250);
    --popover: oklch(1 0 0); --border: oklch(0 0 0 / 0.08); --mark: #ff2d2d;
  }
  :root.dark {
    --background: oklch(0.165 0.003 260); --foreground: oklch(0.97 0 0); --card: oklch(0.215 0.004 260);
    --muted: oklch(0.27 0.004 260); --muted-foreground: oklch(0.72 0.005 260); --brand: oklch(0.87 0.16 152);
    --brand-text: oklch(0.87 0.16 152); --brand-mark: oklch(0.87 0.16 152); --primary-foreground: oklch(0.18 0.02 160);
    --popover: oklch(0.24 0.004 260); --border: oklch(1 0 0 / 0.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Manrope", sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .page { max-width: 1520px; margin: 0 auto; padding: 24px 24px 80px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .topbar p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 14px; }
  .toggle { border: 0; border-radius: 999px; background: var(--card); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; }
  .proposal { margin-top: 36px; }
  .proposal-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--foreground); color: var(--background); font-weight: 800; font-size: 18px; }
  .proposal-head h2 { font-size: 18px; margin: 0; }
  .note { color: var(--muted-foreground); font-size: 14px; margin: 4px 0 14px; max-width: 820px; line-height: 1.5; }
  .frames { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  .frames .mobile-col { max-width: 390px; }

  .frame { border-radius: 20px; outline: 1px solid var(--border); background: var(--background); overflow: hidden; }
  .frame-label { font-size: 12px; color: var(--muted-foreground); margin: 0 0 6px 4px; font-weight: 600; }
  .desktop-fit { overflow: hidden; }
  .desktop { width: 1440px; transform-origin: 0 0; }
  .mobile { width: 390px; position: relative; height: 560px; }

  /* Header reproduction (top-nav.tsx) */
  .hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 16px 32px; }
  .hdr .left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; }
  .nav { position: relative; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--card); padding: 6px; }
  .tab { position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 16px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; cursor: pointer; text-decoration: none; }
  .tab:hover { color: var(--foreground); }
  .tab.active { background: var(--foreground); color: var(--background); }
  .tab .ic { font-size: 18px; }
  .right { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .round { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; min-width: 44px; border-radius: 999px; background: var(--card); color: var(--muted-foreground); font-size: 14px; font-weight: 500; border: 0; font-family: inherit; cursor: pointer; }
  .round:hover { color: var(--foreground); }
  .round .ic { font-size: 20px; }
  .round.labelled { padding: 0 16px 0 14px; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: var(--primary-foreground); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 10px; border-radius: 999px; background: var(--card); padding: 6px; }
  .avatar { width: 40px; height: 40px; border-radius: 999px; background: oklch(0.87 0.16 152); color: oklch(0.18 0.02 160); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .chip .name { line-height: 1.2; white-space: nowrap; }
  .chip .name b { display: block; font-size: 16px; font-weight: 500; }
  .chip .name span { font-size: 14px; color: var(--muted-foreground); }
  .caret { width: 40px; height: 40px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 18px; }
  .content { padding: 20px 32px 28px; }
  .content h3 { font-size: 56px; letter-spacing: -0.03em; margin: 0; font-weight: 600; }
  .content p { color: var(--muted-foreground); margin: 6px 0 0; font-size: 14px; }

  /* Mobile */
  .m-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .m-hdr .group { display: flex; align-items: center; gap: 8px; }
  .sheet { position: absolute; inset: 76px auto 0 0; border-top-right-radius: 20px; width: 300px; background: var(--card); padding: 18px 14px; box-shadow: 0 0 0 9999px oklch(0 0 0 / 0.5); }
  .sheet .close { display: flex; justify-content: flex-end; color: var(--muted-foreground); font-size: 22px; margin-bottom: 18px; }
  .m-item { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 999px; color: var(--muted-foreground); font-size: 18px; font-weight: 500; }
  .m-item.active { background: var(--foreground); color: var(--background); }
  .m-item .ic { font-size: 22px; }
  .m-item .count { margin-left: 2px; min-width: 22px; height: 22px; border-radius: 999px; background: oklch(0.87 0.16 152 / 0.18); color: var(--brand-text); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

  /* B: soft background behind the icon */
  .b .tab .ic, .b .m-item .ic { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--muted); font-size: 16px; }
  .b .tab { padding-left: 6px; }
  .b .tab.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .m-item { padding-left: 8px; }
  .b .m-item .ic { width: 34px; height: 34px; font-size: 19px; }
  .b .m-item.active .ic { background: oklch(0.5 0 0 / 0.18); }
  .b .round.labelled .ic { font-size: 18px; }

  /* C: icon above the label */
  .c .tab { flex-direction: column; justify-content: center; gap: 2px; height: 56px; padding: 0 14px; font-size: 13px; border-radius: 18px; }
  .c .nav { border-radius: 24px; }
  .c .tab .ic { font-size: 20px; }
  .c .round.stacked { flex-direction: column; gap: 2px; height: 68px; min-width: 64px; border-radius: 20px; font-size: 12px; padding: 0 8px; }
  .c .chip { border-radius: 24px; }
  .c .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .c .m-item { flex-direction: column; justify-content: center; gap: 6px; height: 84px; border-radius: 18px; background: var(--muted); font-size: 15px; padding: 0 8px; }
  .c .m-item.active { background: var(--foreground); }
  .c .m-item .ic { font-size: 24px; }

  /* Tooltip (components/ui/tooltip.tsx look) */
  .tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: var(--foreground); color: var(--background); font-size: 12px; line-height: 1.35; padding: 6px 12px; border-radius: 8px; opacity: 0; transform: translateY(2px) scale(0.97); transition: opacity 120ms, transform 120ms; }
  .tip.on { opacity: 1; transform: none; }
  .tip::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -4px; width: 10px; height: 10px; margin-left: -5px; background: var(--foreground); transform: rotate(45deg); border-radius: 2px; }
  .tip.below::after { bottom: auto; top: -4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted-foreground); font-size: 13px; margin-top: 10px; }
  .legend b { color: var(--foreground); font-weight: 600; }

  .term { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  .wrap { padding: 8px 32px 32px; font-size: 14px; }
  .top4 { display: flex; justify-content: space-between; align-items: center; }
  .cta4 { height: 40px; border-radius: 999px; background: oklch(0.8 0.17 152); color: oklch(0.18 0.02 160); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 500; }
  .cta4 .ic, .b4 .ic { display: inline-flex; }
  .srch4 { height: 40px; width: 360px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted-foreground); }
  .tbl4 { margin-top: 14px; border-radius: 22px; background: var(--card); padding: 0 18px; }
  .hd4, .r4 { display: grid; grid-template-columns: 1.6fr 0.9fr 0.8fr 1.1fr 0.6fr 120px; gap: 12px; align-items: center; }
  .hd4 { color: var(--muted-foreground); font-size: 13px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .r4 { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .r4:last-child { border-bottom: 0; }
  .r4 p { margin: 2px 0 0; color: var(--muted-foreground); font-size: 12px; }
  .mono { font-family: ui-monospace, monospace; font-size: 13px; }
  .comp { border-radius: 999px; padding: 3px 10px; font-size: 12px; display: inline-flex; gap: 4px; }
  .comp.red { background: oklch(0.6 0.2 25 / 0.18); color: oklch(0.72 0.18 25); }
  .comp.amber { background: oklch(0.8 0.15 85 / 0.15); color: oklch(0.85 0.15 90); }
  .b4 { justify-self: end; height: 32px; border-radius: 999px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); font-size: 13px; }
  .b4.p { background: oklch(0.8 0.17 152); color: oklch(0.18 0.02 160); border-color: transparent; }
  .mob { padding: 14px; font-size: 14px; }
  .mob .hd4 { display: none; }
  .mob .r4 { grid-template-columns: 1fr auto; }
  .mob .r4 > :nth-child(2), .mob .r4 > :nth-child(3), .mob .r4 > :nth-child(5) { display: none; }
  .mob .srch4 { width: auto; margin-top: 10px; }
  .mob .top4 { flex-direction: column; align-items: stretch; gap: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><div><h1>Fornecedor · 3a. Produtos: lista</h1><p>Passe o mouse ou toque em "Completude", nos selos de completude, em "Corrigir" e "Editar".</p></div><button class="toggle" id="theme" type="button">Mudar para o modo claro</button></div>
  <div id="root"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

l=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M120.49,167.51a12,12,0,0,1,0,17l-32,32a12,12,0,0,1-17,0l-32-32a12,12,0,1,1,17-17L68,179V48a12,12,0,0,1,24,0V179l11.51-11.52A12,12,0,0,1,120.49,167.51Zm96-96-32-32a12,12,0,0,0-17,0l-32,32a12,12,0,0,0,17,17L164,77V208a12,12,0,0,0,24,0V77l11.51,11.52a12,12,0,0,0,17-17Z\"></path></svg>","fill":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M119.39,172.94a8,8,0,0,1-1.73,8.72l-32,32a8,8,0,0,1-11.32,0l-32-32A8,8,0,0,1,48,168H72V48a8,8,0,0,1,16,0V168h24A8,8,0,0,1,119.39,172.94Zm94.27-98.6-32-32a8,8,0,0,0-11.32,0l-32,32A8,8,0,0,0,144,88h24V208a8,8,0,0,0,16,0V88h24a8,8,0,0,0,5.66-13.66Z\"></path></svg>","duotone":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1em\" height=\"1em\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M176,48V208H80V48Z\" opacity=\"0.2\"></path><path d=\"M117.66,170.34a8,8,0,0,1,0,11.32l-32,32a8,8,0,0,1-11.32,0l-32-32a8,8,0,0,1,11.32-11.32L72,188.69V48a8,8,0,0,1,16,0V188.69l18.34-18.35A8,8,0,0,1,117.66,170.34Zm96-96-32-32a8,8,0,0,0-11.32,0l-32,32a8,8,0,0,0,11.32,11.32L168,67.31V208a8,8,0,0,0,16,0V67.31l18.34,18.35a8,8,0,0,0,11.32-11.32Z\"></path></svg>"}}
;
const HINT = {
  completeness: "Quanto do cadastro está preenchido; produtos completos vendem mais",
  blocking: "Faltam itens obrigatórios: o produto não pode ser publicado",
  improve: "Já pode ser publicado, mas fotos e detalhes extras ajudam a vender",
  fix: "Abre o cadastro direto no que precisa corrigir",
  edit: "Abre o cadastro do produto",
  create: "Cadastrar um produto novo, passo a passo",
};
const PROPOSALS = [
  { key: "now", letter: "–", title: "Como está hoje", note: "\"SKU\" na busca e no cabeçalho; \"Completude\" e os selos (\"2 impedem publicar\", \"Pode melhorar\") sem explicação; \"Corrigir\" e \"Editar\" não dizem o que abrem." },
  { key: "a", letter: "A", title: "Só legendas e termos claros (recomendada)", note: "\"SKU\" vira \"Código\" (cabeçalho e busca). Legendas em \"Completude\", nos selos, em \"Corrigir\", \"Editar\" e \"Cadastrar produto\". Botões continuam só com texto: as palavras já dizem a ação." },
  { key: "b", letter: "B", title: "Botões com ícone", note: "Como A, e \"Corrigir\" ganha uma chave inglesa e \"Editar\" um lápis. Mais visual, mas soma um ícone por linha." },
  { key: "c", letter: "C", title: "Coluna renomeada", note: "Como A, e \"Completude\" vira \"Cadastro\", com os selos dizendo \"44% · falta o obrigatório\" e \"94% · pode melhorar\"." },
];
const ic = (n) => `<span class="ic">${ICONS[n].regular}</span>`;
const tipOf = (k, t) => (k === "now" ? "" : ` data-tip="${t}" tabindex="0"`);
function row(k, name, cat, code, status, pct, kind, price, stock, btn) {
  const label = kind === "red" ? (k === "c" ? "falta o obrigatório" : "2 impedem publicar") : (k === "c" ? "pode melhorar" : "Pode melhorar");
  const icon = k === "b" ? ic(btn === "Corrigir" ? "Wrench" : "PencilSimple") : "";
  return `<div class="r4"><div>${name}<p>${cat}</p></div><span class="mono">${code}</span><span>${status}</span><span><span class="comp ${kind}"${tipOf(k, kind === "red" ? HINT.blocking : HINT.improve)}>${pct} · ${label}</span></span><span>${price}</span><span class="b4${btn === "Corrigir" ? " p" : ""}"${tipOf(k, btn === "Corrigir" ? HINT.fix : HINT.edit)}>${icon}${btn}</span></div>`;
}
function body(k) {
  const code = k === "now" ? "SKU" : "Código";
  const comp = k === "now" ? "Completude" : `<span class="term" data-tip="${HINT.completeness}" tabindex="0">${k === "c" ? "Cadastro" : "Completude"}</span>`;
  return `<div class="top4"><div><h2 style="margin:0">Produtos</h2><p style="color:var(--muted-foreground);margin:4px 0 0">Só os aprovados aparecem para os revendedores.</p></div><span class="cta4"${tipOf(k, HINT.create)}>${ic("Plus")}Cadastrar produto</span></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><div class="srch4">${ic("MagnifyingGlass")}Buscar por ${k === "now" ? "SKU" : "código"} ou título</div></div>
    <div class="tbl4"><div class="hd4"><span>Produto</span><span>${code}</span><span>Status</span><span>${comp}</span><span>Custo</span><span></span></div>${row(k, "Fruteira de cerâmica com pé alto", "Cozinha", "CT-FRUTEIRA", "• Rascunho", "44%", "red", "R$ 45,00", 0, "Corrigir")}${row(k, "Caneca de cerâmica 350 ml", "Cozinha", "CT-CANECA-350", "• Aprovado", "94%", "amber", "R$ 18,90", 120, "Editar")}</div>`;
}
function desktop(k) { return `<div class="wrap">${body(k)}</div>`; }
function mobile(k) { return `<div class="mob">${body(k)}</div>`; }
function render() {
  document.getElementById("root").innerHTML = PROPOSALS.map((p) => `
    <section class="proposal ${p.key}" id="proposta-${p.key}">
      <div class="proposal-head"><span class="letter">${p.letter}</span><h2>${p.title}</h2></div>
      <p class="note">${p.note}</p>
      <div class="frames">
        <div><p class="frame-label">Computador · 1440 px</p><div class="frame desktop-fit"><div class="desktop">${desktop(p.key)}</div></div></div>
        <div class="mobile-col"><p class="frame-label">Celular · 390 px</p><div class="frame" style="width:390px">${mobile(p.key)}</div></div>
      </div>
    </section>`).join("");
  fit();
}
function fit() {
  document.querySelectorAll(".desktop-fit").forEach((box) => {
    const inner = box.firstElementChild;
    const scale = Math.min(1, box.clientWidth / 1440);
    inner.style.transform = `scale(${scale})`;
    box.style.height = `${inner.offsetHeight * scale}px`;
  });
}
// Tooltip: 300 ms on hover, at once on focus, tap toggles, tap outside closes; flips below at the top edge.
const tip = document.getElementById("tip");
let timer = 0, current = null;
function show(el) {
  current = el;
  tip.textContent = el.dataset.tip;
  tip.classList.remove("below");
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const frame = (el.closest(".frame") ?? document.body).getBoundingClientRect();
  let left = Math.max(frame.left + 8, Math.min(Math.min(window.innerWidth, frame.right) - w - 8, r.left + r.width / 2 - w / 2));
  let top = r.top - h - 10;
  if (top < 8) { top = r.bottom + 10; tip.classList.add("below"); }
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
  tip.style.setProperty("--arrow", `${r.left + r.width / 2 - left}px`);
  tip.classList.add("on");
}
function hide() { clearTimeout(timer); current = null; tip.classList.remove("on"); }
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el === current) return;
  hide();
  if (el) timer = setTimeout(() => show(el), 300);
});
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  const el = e.target.closest("[data-tip]");
  if (el && el !== current) { hide(); show(el); return; }
  hide();
});
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
document.addEventListener("focusout", hide);
window.addEventListener("scroll", hide, { passive: true });
window.addEventListener("resize", fit);
const themeButton = document.getElementById("theme");
themeButton.addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  themeButton.textContent = dark ? "Mudar para o modo claro" : "Mudar para o modo escuro";
});
render();
document.fonts.ready.then(fit);
</script>
